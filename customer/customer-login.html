<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073a2b">
<title>Al Noor Loyalty — Customer Login</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="../assets/config.js"></script>
<style>
:root{--green:#064b3b;--sage:#eef3ec;--cream:#fbfaf4;--text:#173f35;--muted:#647477}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#eef1ec,#faf8ef);font-family:Arial,sans-serif;color:var(--text)}
.login-page{min-height:100vh;display:flex;justify-content:center;padding:0 14px}
.login-shell{width:min(100%,430px);min-height:100vh;background:rgba(255,253,247,.97);border-left:1px solid #e5e0d1;border-right:1px solid #e5e0d1;border-radius:0 0 42px 42px;padding:28px 34px 30px;box-shadow:0 18px 55px #173f3514}
.status{height:22px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:#111}
.logo-wrap{text-align:center;margin:34px auto 22px}
.logo-wrap img{width:250px;max-width:82%;height:auto;display:block;margin:auto;object-fit:contain}
h1{font-family:Georgia,serif;text-align:center;font-size:48px;line-height:1.05;margin:22px 0 10px;color:var(--green)}
.lead{text-align:center;color:var(--muted);font-size:17px;line-height:1.5;margin:0 auto 32px;max-width:330px}
.field{margin-bottom:18px}
label{display:block;font-size:15px;font-weight:800;color:var(--green);margin:0 0 8px}
.input{width:100%;height:64px;border:1.5px solid #d2d6d2;border-radius:20px;background:#fff;padding:0 20px;font-size:17px;outline:none}
.input:focus{border-color:var(--green);box-shadow:0 0 0 4px #064b3b12}
.btn{width:100%;height:62px;border:0;border-radius:20px;font-size:17px;font-weight:800;cursor:pointer}
.primary{background:var(--green);color:white;box-shadow:0 10px 22px #064b3b20}
.soft{background:var(--sage);color:var(--green);border:1px solid #dbe4dc}
.divider{display:flex;align-items:center;gap:14px;color:#748184;margin:24px 0}
.divider:before,.divider:after{content:"";height:1px;background:#d7dbd8;flex:1}
.otp-card{background:#f0f4ed;border-radius:22px;padding:24px;margin-bottom:18px}
.otp-title{font-size:18px;font-weight:800;color:var(--green);margin-bottom:8px}
.otp-sub{font-size:14px;color:#607176;margin-bottom:18px}
.otp-input{letter-spacing:10px;text-align:center;font-size:25px;font-weight:800}
.resend{display:block;text-align:center;color:#53686b;margin-top:18px;text-decoration:underline;cursor:pointer;background:none;border:0;width:100%}
.bottom{text-align:center;margin-top:18px}
.back{display:block;text-align:center;color:#6c7b7e;margin-top:22px;text-decoration:none;font-size:16px}
.note{text-align:center;min-height:20px;margin:12px 0;color:#5e7072;font-size:13px}
@media(max-width:390px){.login-shell{padding:24px 22px 26px}.logo-wrap{margin-top:28px}.logo-wrap img{width:220px}h1{font-size:40px}.lead{font-size:15px}.input,.btn{height:58px}}
</style>
</head>
<body data-page="customer-login">
<div class="login-page"><div class="login-shell">
  <div class="status"><span>Al Noor</span><span>LOYALTY</span></div>
  <div class="logo-wrap"><img src="../assets/al-noor-official-logo.jpg" alt="Al Noor Bakery & Cafe"></div>
  <h1>Welcome Back</h1>
  <p class="lead">Sign in to your Al Noor Loyalty account with a verification code.</p>

  <div id="emailArea">
    <div class="field"><label>Email</label>
      <input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com">
    </div>
    <button id="sendBtn" class="btn primary" type="button">Send Login Code →</button>
  </div>

  <div class="divider">OR</div>

  <div id="otpArea" class="otp-card" style="display:none">
    <div class="otp-title">Enter Verification Code</div>
    <div class="otp-sub">We've sent a 6-digit code to your email.</div>
    <input id="otp" class="input otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    <button id="verifyBtn" class="btn primary" style="margin-top:18px" type="button">Verify Code →</button>
    <button id="resendBtn" class="resend" type="button">Resend Code</button>
  </div>

  <div id="msg" class="note" aria-live="polite"></div>
  <div class="bottom"><a href="customer-register.html" class="btn soft" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Create Loyalty Account</a></div>
  <a href="../index.html" class="back">← Back</a>
</div></div>

<script>
(function(){
  const cfg=window.AL_NOOR_CONFIG||{};
  const emailArea=document.getElementById("emailArea"), otpArea=document.getElementById("otpArea");
  const email=document.getElementById("email"), otp=document.getElementById("otp");
  const send=document.getElementById("sendBtn"), verify=document.getElementById("verifyBtn"), resend=document.getElementById("resendBtn"), msg=document.getElementById("msg");
  const show=(t,e=false)=>{msg.textContent=t||"";msg.style.color=e?"#a33b2f":"#5e7072";};
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_PUBLISHABLE_KEY||typeof supabase==="undefined"){show("Al Noor connection is not configured.",true);send.disabled=true;return;}
  const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let pendingEmail="";
  async function sendCode(){
    const value=email.value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)){show("Please enter a valid email address.",true);return;}
    send.disabled=true;resend.disabled=true;send.textContent="Sending…";show("Sending your secure login code…");
    try{
      const {error}=await sb.auth.signInWithOtp({email:value,options:{shouldCreateUser:false}});
      if(error)throw error;
      pendingEmail=value;emailArea.style.display="none";otpArea.style.display="block";
      show("A 6-digit verification code was sent to your email.");otp.focus();
    }catch(e){console.error(e);show(e?.message||"We could not send the login code.",true);send.disabled=false;send.textContent="Send Login Code →";}
    finally{resend.disabled=false;}
  }
  async function verifyCode(){
    const token=otp.value.trim();
    if(!pendingEmail)return show("Please request a login code first.",true);
    if(!/^\d{6}$/.test(token))return show("Please enter the 6-digit verification code.",true);
    verify.disabled=true;resend.disabled=true;verify.textContent="Opening My Card…";show("Verifying your login…");
    try{
      const {data,error}=await sb.auth.verifyOtp({email:pendingEmail,token,type:"email"});
      if(error)throw error;
      if(!data?.session)throw new Error("Verification succeeded, but no session was returned.");
      location.replace("customer-card.html");
    }catch(e){console.error(e);show(e?.message||"The verification code is invalid or expired.",true);verify.disabled=false;resend.disabled=false;verify.textContent="Verify Code →";}
  }
  send.onclick=sendCode;verify.onclick=verifyCode;resend.onclick=sendCode;
  email.onkeydown=e=>{if(e.key==="Enter")sendCode();};otp.onkeydown=e=>{if(e.key==="Enter")verifyCode();};
})();
</script>
</body></html>
