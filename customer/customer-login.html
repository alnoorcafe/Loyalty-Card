<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#063D2A">
<title>Customer Login</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>

<main class="page"><div class="shell" style="max-width:520px">
<section class="card" style="padding:28px;margin-top:6vh">
<div class="brand"><div class="logo-mark"><div class="sun"></div><div class="leaf"></div><div class="stem"></div></div><div class="brand-name">AL NOOR</div><div class="brand-sub">LOYALTY</div></div>
<div class="eyebrow" style="text-align:center;margin-top:22px">CUSTOMER</div>
<h1 style="text-align:center;margin:7px 0">Welcome Back</h1>
<p class="muted" style="text-align:center;font-size:13px">Enter your email and we'll send you a secure login link.</p>
<form class="form" id="loginForm" style="margin-top:24px">
<div class="field"><label>Email Address</label><input id="email" type="email" placeholder="example@email.com" required></div>
<div id="msg"></div>
<button class="btn btn-primary btn-full" type="submit">Send Login Link</button>
</form>
<div style="text-align:center;margin-top:18px;font-size:12px;color:var(--muted)">Don't have an account? <a style="color:var(--green);font-weight:800" href="customer-register.html">Register</a></div>
<div style="text-align:center;margin-top:18px"><a style="font-size:11px;color:var(--muted)" href="../index.html">Back to Al Noor</a></div>
</section></div></main>

<script src="../assets/app.js"></script>

<script>
document.getElementById("loginForm").addEventListener("submit",e=>{
 e.preventDefault();
 document.getElementById("msg").className="notice info";
 document.getElementById("msg").textContent="Demo mode: Supabase will be connected after the complete GitHub file set is finished.";
 localStorage.setItem("alnoor_demo_session","customer");
 setTimeout(()=>location.href="customer-home.html",700);
});
</script>

</body>
</html>
