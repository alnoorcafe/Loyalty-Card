<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><title>Al Noor Loyalty — Customer Login</title><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="../assets/config.js"></script><style>:root{--g:#064b3b;--s:#eef3ec;--c:#fbfaf4;--m:#647477}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef1ec,#faf8ef);font-family:Arial,sans-serif;color:#173f35}.page{min-height:100vh;display:flex;justify-content:center;padding:0 14px}.shell{width:min(100%,430px);min-height:100vh;background:rgba(255,253,247,.97);border:1px solid #e5e0d1;border-top:0;border-radius:0 0 42px 42px;padding:28px 34px 30px;box-shadow:0 18px 55px #173f3514}.status{height:22px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#111}.logo{text-align:center;margin:34px auto 22px}.logo img{width:250px;max-width:82%;height:auto;display:block;margin:auto}.logo h1{font-family:Georgia,serif;text-align:center;font-size:48px;line-height:1.05;margin:22px 0 10px;color:var(--g)}.lead{text-align:center;color:var(--m);font-size:17px;line-height:1.5;margin:0 auto 32px}.field{margin-bottom:18px}label{display:block;font-size:15px;font-weight:800;color:var(--g);margin-bottom:8px}.input{width:100%;height:64px;border:1.5px solid #d2d6d2;border-radius:20px;background:#fff;padding:0 20px;font-size:17px;outline:none}.input:focus{border-color:var(--g);box-shadow:0 0 0 4px #064b3b12}.btn{width:100%;height:62px;border:0;border-radius:20px;font-size:17px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff;box-shadow:0 10px 22px #064b3b20}.soft{background:var(--s);color:var(--g);border:1px solid #dbe4dc}.divider{display:flex;align-items:center;gap:14px;color:#748184;margin:24px 0}.divider:before,.divider:after{content:"";height:1px;background:#d7dbd8;flex:1}.otp{background:#f0f4ed;border-radius:22px;padding:24px;margin-bottom:18px}.otp b{font-size:18px;color:var(--g)}.otp p{font-size:14px;color:#607176;margin:8px 0 18px}.otp input{text-align:center;letter-spacing:10px;font-size:25px;font-weight:800}.resend{display:block;margin:18px auto 0;background:none;border:0;text-decoration:underline;color:#53686b;font-size:15px}.note{text-align:center;min-height:20px;margin:12px 0;color:#5e7072;font-size:13px}.bottom{text-align:center;margin-top:18px}.back{display:block;text-align:center;color:#6c7b7e;margin-top:22px;text-decoration:none;font-size:16px}@media(max-width:390px){.shell{padding:24px 22px 26px}.logo img{width:220px}.logo h1{font-size:40px}.lead{font-size:15px}.input,.btn{height:58px}}</style></head><body data-page="customer-login"><div class="page"><div class="shell"><div class="status"><span>11:44</span><span>●●●　Wi‑Fi　▰</span></div><div class="logo"><img src="../assets/al-noor-official-logo.jpeg" alt="Al Noor Bakery & Cafe"></div><h1>Welcome Back</h1><p class="lead">Sign in to your Al Noor Loyalty account with a verification code.</p><div id="emailArea"><div class="field"><label>Email</label><input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com"></div><button id="sendBtn" class="btn primary">Send Login Code →</button></div><div class="divider">OR</div><div id="otpArea" class="otp" style="display:none"><b>Enter Verification Code</b><p>We've sent a 6-digit code to your email.</p><input id="otp" class="input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"><button id="verifyBtn" class="btn primary" style="margin-top:18px">Verify Code →</button><button id="resendBtn" class="resend">Resend Code</button></div><div id="msg" class="note" aria-live="polite"></div><div class="bottom"><a href="customer-register.html" class="btn soft" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Create Loyalty Account</a></div><a href="../index.html" class="back">← Back</a></div></div><script>(function(){const c=window.AL_NOOR_CONFIG||{},e=document.getElementById('email'),o=document.getElementById('otp'),ea=document.getElementById('emailArea'),oa=document.getElementById('otpArea'),s=document.getElementById('sendBtn'),v=document.getElementById('verifyBtn'),r=document.getElementById('resendBtn'),m=document.getElementById('msg'),show=(t,x=false)=>{m.textContent=t||'';m.style.color=x?'#a33b2f':''};if(!c.SUPABASE_URL||!c.SUPABASE_PUBLISHABLE_KEY||typeof supabase==='undefined'){show('Al Noor connection is not configured.',true);s.disabled=true;return}const sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let pe='';async function send(){const x=e.value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x))return show('Please enter a valid email address.',true);s.disabled=true;r.disabled=true;s.textContent='Sending…';try{const{error}=await sb.auth.signInWithOtp({email:x,options:{shouldCreateUser:false}});if(error)throw error;pe=x;ea.style.display='none';oa.style.display='block';show('A 6-digit verification code was sent to your email.');o.focus()}catch(q){show(q?.message||'We could not send the login code.',true);s.disabled=false;s.textContent='Send Login Code →'}finally{r.disabled=false}}async function verify(){const t=o.value.trim();if(!pe)return show('Please request a login code first.',true);if(!/^\d{6}$/.test(t))return show('Please enter the 6-digit verification code.',true);v.disabled=true;r.disabled=true;v.textContent='Opening My Card…';try{const{data,error}=await sb.auth.verifyOtp({email:pe,token:t,type:'email'});if(error)throw error;if(!data?.session)throw new Error('Verification succeeded, but no session was returned.');location.replace('customer-card.html')}catch(q){show(q?.message||'The verification code is invalid or expired.',true);v.disabled=false;r.disabled=false;v.textContent='Verify Code →'}}s.onclick=send;v.onclick=verify;r.onclick=send;e.onkeydown=q=>{if(q.key==='Enter')send()};o.onkeydown=q=>{if(q.key==='Enter')verify()}})();</script></body></html>
