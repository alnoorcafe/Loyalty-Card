<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073b2b"><link rel="manifest" href="../manifest.webmanifest"><title>Al Noor Loyalty — Create Account</title><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="../assets/config.js"></script></head><body data-page="customer-register"><main class="auth"><div class="authbox"><div class="logo"><img src="../assets/al-noor-logo.jpg" alt="AL NOOR BAKERY & CAFE"></div><h2>Create Account</h2><p class="sub">Register your loyalty details and receive a secure email sign-in link.</p><div class="field"><label>Full Name</label><input id="name" class="input" autocomplete="name" placeholder="Your full name"></div><div class="field"><label>Mobile Number</label><input id="phone" class="input" type="tel" autocomplete="tel" placeholder="+971 5X XXX XXXX"></div><div class="field"><label>Email</label><input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Date of Birth <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="birthday" class="input" type="date"></div><label class="check"><input id="birthdayContact" type="checkbox"><span>I agree that Al Noor may contact me about birthday and loyalty benefits.</span></label><button id="registerBtn" class="btn primary block">Create Account →</button><div id="msg" class="note"></div><div class="center" style="margin-top:14px"><a href="customer-login.html" class="sub">Already have an account? Sign in</a></div></div></main><script src="../assets/app.js"></script></body></html>
