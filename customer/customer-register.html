<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073a2b">
<title>Al Noor Loyalty — Create Account</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="../assets/config.js"></script>
</head>
<body data-page="customer-register">
<div class="auth"><div class="authbox">
<div class="logo"><img class="official-logo" src="../assets/al-noor-official-logo.jpeg" alt="AL NOOR BAKERY & CAFE"></div>
<h2>Create Loyalty Account</h2>
<p class="sub">Register your Al Noor Loyalty account.</p>
<div class="field"><label>Name</label><input id="name" class="input" type="text" autocomplete="name" placeholder="Your name"></div>
<div class="field"><label>Phone</label><input id="phone" class="input" type="tel" autocomplete="tel" placeholder="05xxxxxxxx"></div>
<div class="field"><label>Email</label><input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com"></div>
<div class="field"><label>Password</label><input id="password" class="input" type="password" autocomplete="new-password" placeholder="Create a password"></div>
<div class="field"><label>Confirm Password</label><input id="confirmPassword" class="input" type="password" autocomplete="new-password" placeholder="Repeat password"></div>
<button id="registerBtn" class="btn primary block" type="button">Create Account →</button>
<div id="msg" class="note" aria-live="polite"></div>
<div class="center" style="margin-top:16px"><a href="customer-login.html" class="btn soft block">Already have an account? Sign In</a></div>
<div class="center" style="margin-top:14px"><a href="../index.html" class="sub">← Back</a></div>
</div></div>
<script>
(function(){
  const cfg=window.AL_NOOR_CONFIG||{}, msg=document.getElementById("msg"), btn=document.getElementById("registerBtn");
  const show=(t,e)=>{msg.textContent=t||"";msg.style.color=e?"#a33b2f":""};
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_PUBLISHABLE_KEY||typeof supabase==="undefined"){
    show("Al Noor connection is not configured.",true);btn.disabled=true;return;
  }
  const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  btn.addEventListener("click",async()=>{
    const name=document.getElementById("name").value.trim();
    const phone=document.getElementById("phone").value.trim();
    const email=document.getElementById("email").value.trim().toLowerCase();
    const password=document.getElementById("password").value;
    const confirm=document.getElementById("confirmPassword").value;
    if(!name||!phone||!email||!password){show("Please complete all required fields.",true);return;}
    if(password.length<6){show("Password must be at least 6 characters.",true);return;}
    if(password!==confirm){show("Passwords do not match.",true);return;}
    btn.disabled=true;show("Creating your account...");
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{name,phone,role:"customer"}}});
    if(error){show(error.message,true);btn.disabled=false;return;}
    if(data.session){location.href="customer-card.html";return;}
    show("Account created. Disable Confirm Email in Supabase, then sign in.",false);
    btn.disabled=false;
  });
})();
</script>
</body>
</html>
