<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e5"><title>Al Noor Loyalty — Create Account</title><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://unpkg.com/html5-qrcode"></script></head>
<body class="customer-page" data-page="customer-register"><main class="customer-auth"><section class="customer-auth-card">
<div class="customer-auth-brand"><div class="mark">☀️</div><h1>AL NOOR</h1><small>LOYALTY</small></div>
<h2>Create Account</h2><p class="sub">Create your Al Noor Loyalty account and receive your personal QR code.</p>
<div class="auth-field"><label for="name">Full Name</label><input id="name" autocomplete="name" placeholder="Full name"></div>
<div class="auth-field"><label for="phone">Mobile Number</label><input id="phone" type="tel" autocomplete="tel" placeholder="+971 5x xxx xxxx"></div>
<div class="auth-field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div>
<div class="auth-field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
<div class="auth-field"><label for="confirm">Confirm Password</label><input id="confirm" type="password" autocomplete="new-password" placeholder="Repeat password"></div>
<button id="registerBtn" class="auth-primary">Create My Loyalty Account&nbsp; →</button><div id="msg" class="auth-msg"></div>
<a class="auth-back" href="customer-login.html">Already have an account? Sign in</a>
</section></main><script src="../assets/config.js"></script>
<script src="../assets/app.js"></script></body></html>
