<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073b2b">
<title>Al Noor Loyalty — Create Account</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="../assets/config.js"></script>
</head>
<body data-page="customer-register">
<div class="auth"><div class="authbox">
<div class="logo"><img class="official-logo" src="../assets/al-noor-official-logo.jpeg" alt="AL NOOR BAKERY & CAFE"></div>
<h2>Create Account</h2>
<p class="sub">Create your Al Noor Loyalty account and receive a secure sign-in code.</p>

<div id="registrationFields">
<div class="field"><label>Full Name</label><input id="name" class="input" type="text" autocomplete="name" placeholder="Your full name"></div>
<div class="field"><label>Mobile Number</label><input id="phone" class="input" type="tel" autocomplete="tel" placeholder="+971 5X XXX XXXX"></div>
<div class="field"><label>Email</label><input id="email" class="input" type="email" autocomplete="email" placeholder="you@example.com"></div>
<div class="field"><label>Date of Birth</label><input id="birthday" class="input" type="date" autocomplete="bday"></div>
<label style="display:flex;gap:10px;align-items:flex-start;margin-top:17px;color:#7b837d;font-family:Arial,sans-serif;font-size:13px;line-height:1.4">
<input id="birthdayContact" type="checkbox" style="margin-top:3px;accent-color:#073b2b">
<span>I agree that Al Noor may contact me about my birthday and loyalty benefits.</span>
</label>
<button id="registerBtn" class="btn primary block">Create My Loyalty Account →</button>
</div>

<div id="otpArea" style="display:none">
<div class="field"><label>Verification Code</label><input id="otp" class="input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Enter 6-digit code"></div>
<button id="verifyBtn" class="btn primary block">Verify & Open My Account →</button>
<button id="resendBtn" class="btn soft block" style="margin-top:10px">Send Code Again</button>
</div>

<div id="msg" class="note" aria-live="polite"></div>
<div class="center" style="margin-top:14px"><a href="customer-login.html" class="sub">Already have an account? Sign in</a></div>
<div class="center" style="margin-top:10px"><a href="../index.html" class="sub">← Back</a></div>
</div></div>

<script>
(function(){
  const cfg=window.AL_NOOR_CONFIG||{}, msg=document.getElementById("msg");
  const registerBtn=document.getElementById("registerBtn"), verifyBtn=document.getElementById("verifyBtn"), resendBtn=document.getElementById("resendBtn");
  const fields=document.getElementById("registrationFields"), otpArea=document.getElementById("otpArea");
  const url=cfg.SUPABASE_URL, key=cfg.SUPABASE_PUBLISHABLE_KEY;
  function show(t,e){msg.textContent=t||"";msg.style.color=e?"#a33b2f":"";}
  if(!url||!key||typeof supabase==="undefined"){show("Al Noor connection is not configured. Please check assets/config.js.",true);registerBtn.disabled=true;return;}
  const sb=supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let pendingEmail="";
  async function sendCode(){
    const fullName=document.getElementById("name").value.trim(), phone=document.getElementById("phone").value.trim();
    const email=document.getElementById("email").value.trim().toLowerCase(), birthday=document.getElementById("birthday").value;
    const birthdayContact=document.getElementById("birthdayContact").checked;
    if(!fullName)return show("Please enter your full name.",true);
    if(!phone)return show("Please enter your mobile number.",true);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return show("Please enter a valid email address.",true);
    if(!birthday)return show("Please enter your date of birth.",true);
    registerBtn.disabled=true;registerBtn.textContent="Sending Code…";show("Sending your secure verification code…");
    try{
      const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,data:{full_name:fullName,mobile_number:phone,birthday,birthday_contact:birthdayContact,role:"customer"}}});
      if(error)throw error;
      pendingEmail=email;fields.style.display="none";otpArea.style.display="block";registerBtn.style.display="none";
      show("A 6-digit verification code was sent to your email.");document.getElementById("otp").focus();
    }catch(e){console.error(e);show(e?.message||"We could not send the verification code.",true);registerBtn.disabled=false;registerBtn.textContent="Create My Loyalty Account →";}
  }
  async function verifyCode(){
    const token=document.getElementById("otp").value.trim();
    if(!pendingEmail)return show("Please request a verification code first.",true);
    if(!/^\d{6}$/.test(token))return show("Please enter the 6-digit verification code.",true);
    verifyBtn.disabled=true;resendBtn.disabled=true;verifyBtn.textContent="Verifying…";show("Verifying your account…");
    try{
      const {data,error}=await sb.auth.verifyOtp({email:pendingEmail,token,type:"email"});
      if(error)throw error;if(!data?.session)throw new Error("Verification succeeded, but no session was returned.");
      show("Account verified successfully. Opening your loyalty account…");location.href="customer-home.html";
    }catch(e){console.error(e);show(e?.message||"The verification code is invalid or expired.",true);verifyBtn.disabled=false;resendBtn.disabled=false;verifyBtn.textContent="Verify & Open My Account →";}
  }
  registerBtn.addEventListener("click",sendCode);verifyBtn.addEventListener("click",verifyCode);
  resendBtn.addEventListener("click",async()=>{resendBtn.disabled=true;await sendCode();resendBtn.disabled=false;});
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(console.error));
}
</script>
</body>
</html>
