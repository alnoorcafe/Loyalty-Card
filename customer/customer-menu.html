<script src="../assets/app.js?v=20260926-home-card-merge"></script><script>
(async function(){
 const box=document.getElementById("customerMenu"); if(!box)return;
 const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
 const {data,error}=await sb.from("menu_items").select("name,description,price,image_url,status").eq("status","active").order("created_at",{ascending:false});
 if(error){box.innerHTML='<div class="alert">'+esc(error.message)+'</div>';return}
 box.innerHTML=data?.length?data.map(x=>'<div class="reward">'+(x.image_url?'<img class="reward-product-image" src="'+esc(x.image_url)+'" alt="'+esc(x.name)+'">':'<div class="food">☕</div>')+'<div class="grow"><strong>'+esc(x.name)+'</strong><small>'+esc(x.description||"")+'</small></div><span class="badge">AED '+Number(x.price||0).toFixed(2)+'</span></div>').join(""):'<div class="empty">No active menu items.</div>';
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));}</script></body></html>
