<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073a2b">
<meta name="description" content="AL NOOR Bakery & Cafe customer menu">
<link rel="manifest" href="../manifest.webmanifest">
<title>AL NOOR Menu</title>
<link rel="stylesheet" href="../assets/style.css?v=20261003-customer-menu">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
</head>
<body data-page="customer-menu">
<header class="topbar">
  <a class="brand brand-image" href="customer-home.html" aria-label="AL NOOR Home">
    <img class="brand-logo" src="../assets/al-noor-approved-logo.png" alt="AL NOOR BAKERY & CAFE">
  </a>
  <button class="icon" onclick="logout()" title="Sign out" aria-label="Sign out">↪</button>
</header>

<main class="container menu-page">
  <div class="menu-hero">
    <p class="eyebrow">AL NOOR BAKERY & CAFE</p>
    <h1 class="title">Our Menu</h1>
    <p class="sub">Choose a category to view the available items.</p>
  </div>

  <section class="menu-panel card" aria-label="Menu">
    <div id="menuCategoriesView">
      <div class="menu-loading">Loading menu…</div>
    </div>
    <div id="menuItemsView" hidden></div>
  </section>
</main>

<nav class="nav" aria-label="Customer navigation">
  <div class="navin">
    <a href="customer-home.html" data-nav="home"><b>⌂</b>Home</a>
    <a href="customer-rewards.html" data-nav="rewards"><b>★</b>Rewards</a>
    <a href="customer-locations.html" data-nav="locations"><b>⌖</b>Locations</a>
    <a href="customer-offers.html" data-nav="offers"><b>◇</b>Offers</a>
    <a href="customer-menu.html" data-nav="menu" class="active"><b>☰</b>Menu</a>
    <a href="customer-profile.html" data-nav="profile"><b>●</b>My Profile</a>
  </div>
</nav>

<script src="../assets/config.js?v=20261003-customer-menu"></script>
<script src="../assets/app.js?v=20261007-username-name-only-v3"></script>
<script src="../assets/menu-data.js?v=20261003-menu"></script>

<style>
:root{--menu-cream:#f7f1e7;--menu-gold:#c9ae70;--menu-green:#073a2b}
.menu-page{padding-bottom:110px}
.menu-hero{margin-bottom:18px}
.eyebrow{margin:0 0 5px;color:var(--gold,#a78a52);font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase}
.menu-panel{padding:18px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.menu-category{appearance:none;width:100%;height:170px;border:1px solid rgba(7,58,43,.10);background:#efe4d1;border-radius:22px;padding:0;overflow:hidden;position:relative;text-align:center;color:var(--menu-green);cursor:pointer;box-shadow:0 8px 22px rgba(19,48,37,.05);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.menu-category:hover,.menu-category:focus-visible{transform:translateY(-2px);box-shadow:0 12px 28px rgba(19,48,37,.09);border-color:rgba(167,138,82,.55);outline:none}
.menu-icon{width:100%;height:100%;margin:0;border-radius:inherit;display:grid;place-items:center;background:#efe4d1;font-size:30px;line-height:1}.menu-icon img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}.image-fallback{width:100%;height:100%;display:grid;place-items:center;font-size:30px}.menu-item-image-wrap{width:76px;height:76px;flex:0 0 76px;border-radius:17px;border:1px solid rgba(7,58,43,.10);background:#f4eee3;overflow:hidden;display:grid;place-items:center}.menu-item-image-wrap img{width:100%;height:100%;object-fit:cover;display:block}.menu-item-image-wrap .image-fallback{font-size:29px}
.menu-name,.menu-count{display:none!important}
.menu-count{display:block;margin-top:6px;color:var(--muted);font-size:10px;font-weight:800}
.menu-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-back{width:42px;height:42px;flex:0 0 42px;border:1px solid var(--line);background:#edf2eb;border-radius:13px;color:var(--menu-green);font-size:23px;font-weight:900;cursor:pointer}
.menu-head-icon{width:76px;height:76px;flex:0 0 76px;border-radius:17px;background:#efe4d1;display:grid;place-items:center;font-size:21px;overflow:hidden;border:1px solid rgba(7,58,43,.10)}.menu-head-icon img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}.menu-head-icon .image-fallback{width:100%;height:100%;display:grid;place-items:center}
.menu-head-copy{min-width:0}
.menu-head h2{margin:0;color:var(--menu-green);font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.menu-head p{margin:3px 0 0;color:var(--muted);font-size:10px;font-weight:800}
.menu-list{display:grid;gap:0}
.menu-item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.menu-item:last-child{border-bottom:0}
.menu-item-image,.menu-placeholder{width:76px;height:76px;flex:0 0 76px;border-radius:17px;border:1px solid rgba(7,58,43,.10);background:#f4eee3;object-fit:cover}
.menu-placeholder{display:grid;place-items:center;font-size:29px}
.menu-item-copy{min-width:0;flex:1}
.menu-item-name{display:block;color:var(--menu-green);font-size:15px;line-height:1.3;font-weight:900}
.menu-item-description{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:4px}
.menu-item-price{display:inline-flex;align-items:center;justify-content:center;margin-top:7px;padding:6px 10px;border-radius:999px;background:#edf4ed;color:var(--menu-green);font-size:11px;font-weight:900;white-space:nowrap}
.menu-empty,.menu-loading{padding:28px 10px;text-align:center;color:var(--muted);font-weight:700}
.menu-error{padding:22px 14px;border-radius:16px;background:#fff7f5;border:1px solid #ead2cc;color:#8b3a31;font-size:12px;line-height:1.5}
.menu-small-note{margin:0 0 10px;color:var(--muted);font-size:10px;font-weight:700}
@media(max-width:420px){.menu-panel{padding:14px}.menu-grid{gap:10px}.menu-category{height:145px;padding:0}.menu-icon{width:100%;height:100%;font-size:27px}.menu-name{font-size:12px}.menu-item-image,.menu-placeholder{width:64px;height:64px;flex-basis:64px}.menu-item-name{font-size:14px}.menu-item-price{font-size:10px}}
</style>

<script>
(function(){
  const categoriesView=document.getElementById('menuCategoriesView');
  const itemsView=document.getElementById('menuItemsView');

  const FALLBACK_CATEGORIES=[
    {key:'classic-coffee',name:'Classic Coffee',icon:'☕',order:1},
    {key:'craft-pour-over-v60',name:'Craft Pour-Over (V60)',icon:'☕',order:2},
    {key:'iced-coffee',name:'Iced Coffee',icon:'🧊',order:3},
    {key:'matcha',name:'Matcha',icon:'🍵',order:4},
    {key:'breakfast',name:'Breakfast',icon:'🍳',order:5},
    {key:'bakery-croissants',name:'Bakery & Croissants',icon:'🥐',order:10},
    {key:'cakes-pastries',name:'Cakes & Pastries',icon:'🍰',order:11},
    {key:'fresh-juices-wellness',name:'Fresh Juices & Wellness',icon:'🧃',order:12},
    {key:'acai',name:'Acai',icon:'🥭',order:13},
    {key:'mojitos-iced-teas',name:'Mojitos & Iced Teas',icon:'🍹',order:14}
  ];

  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  function validImageSource(value){
    if(typeof value!=='string') return null;
    const v=value.trim();
    if(!v) return null;
    if(/^data:image\/(png|jpe?g|webp|gif|svg\+xml);base64,/i.test(v)) return v;
    if(/^https?:\/\//i.test(v)) return v;
    if(/^\.\.?\//.test(v) || /^assets\//i.test(v)) return v;
    return null;
  }

  function safeIcon(value, fallback){
    const v=String(value??'').trim();
    // Older GM records may have accidentally stored the image URL in the icon column.
    // Never render a URL as visible text in the customer page.
    if(!v || validImageSource(v)) return fallback||'☕';
    if(/^https?:/i.test(v) || /^data:/i.test(v)) return fallback||'☕';
    return v;
  }

  const slug=v=>String(v??'').trim().toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

  let categories=[];
  let items=[];

  function normalizeCategoryRows(rows){
    const result=[];
    const byName={};
    FALLBACK_CATEGORIES.forEach(c=>byName[slug(c.name)]=c);
    (rows||[]).forEach((r,i)=>{
      const base=byName[slug(r.name)]||FALLBACK_CATEGORIES.find(c=>c.key===slug(r.name))||null;
      result.push({
        id:r.id,
        name:r.name||base?.name||'Menu',
        icon:safeIcon(r.icon,base?.icon||'☕'),
        order:Number(r.sort_order??base?.order??(100+i)),
        active:r.is_active!==false,
        // Backward compatibility: if an older record stored its image URL in `icon`,
        // use it as the category image instead of displaying the URL as text.
        image_url:validImageSource(r.image_url) || validImageSource(r.icon) || null
      });
    });
    if(!result.length) return FALLBACK_CATEGORIES.map(c=>({id:null,name:c.name,icon:c.icon,order:c.order,active:true,fallback:true,image_url:null}));
    const existing=new Set(result.map(c=>slug(c.name)));
    FALLBACK_CATEGORIES.forEach(c=>{
      if(!existing.has(slug(c.name))) result.push({id:null,name:c.name,icon:c.icon,order:c.order,active:true,fallback:true,image_url:null});
    });
    return result.filter(c=>c.active).sort((a,b)=>a.order-b.order);
  }

  function isActiveItem(item){
    if(item==null)return false;
    if(item.is_active===false)return false;
    if(typeof item.active==='boolean' && item.active===false)return false;
    if(typeof item.status==='string' && item.status.trim().toLowerCase()==='inactive')return false;
    return true;
  }

  function categoryForItem(item){
    if(item.category_id){
      const exact=categories.find(c=>c.id===item.category_id);
      if(exact)return exact;
    }
    const n=slug(item.category_name||item.category);
    if(n){
      return categories.find(c=>slug(c.name)===n) || FALLBACK_CATEGORIES.find(c=>slug(c.name)===n) || null;
    }
    return null;
  }

  function countForCategory(cat){
    return items.filter(item=>isActiveItem(item) && categoryForItem(item)?.name===cat.name).length;
  }

  function buildSafeImage(src, alt, className, fallbackIcon){
    const wrap=document.createElement('div');
    wrap.className=className;
    wrap.setAttribute('aria-hidden','true');
    if(src){
      const img=document.createElement('img');
      img.className=className==='menu-icon'?'category-image':'menu-item-image';
      img.alt=alt||'';
      img.loading='lazy';
      img.decoding='async';
      img.src=src;
      img.onerror=()=>{
        img.remove();
        if(!wrap.querySelector('.image-fallback')){
          const fallback=document.createElement('span');
          fallback.className='image-fallback';
          fallback.textContent=fallbackIcon||'☕';
          wrap.appendChild(fallback);
        }
      };
      wrap.appendChild(img);
    }else{
      const fallback=document.createElement('span');
      fallback.className='image-fallback';
      fallback.textContent=fallbackIcon||'☕';
      wrap.appendChild(fallback);
    }
    return wrap;
  }

  function renderCategories(){
    itemsView.hidden=true;
    categoriesView.hidden=false;
    categoriesView.innerHTML='';
    const grid=document.createElement('div');
    grid.className='menu-grid';
    categories.forEach(cat=>{
      const btn=document.createElement('button');
      btn.className='menu-category';
      btn.type='button';
      btn.dataset.category=cat.name;
      btn.setAttribute('aria-label',cat.name);
      const icon=buildSafeImage(validImageSource(cat.image_url),'', 'menu-icon',cat.icon);
      btn.appendChild(icon);
      btn.addEventListener('click',()=>renderItems(cat.name));
      grid.appendChild(btn);
    });
    categoriesView.appendChild(grid);
  }

  function renderItems(name){
    const cat=categories.find(c=>c.name===name) || FALLBACK_CATEGORIES.find(c=>c.name===name);
    const filtered=items.filter(item=>isActiveItem(item) && categoryForItem(item)?.name===name);
    itemsView.hidden=false;
    categoriesView.hidden=true;
    itemsView.innerHTML='';

    const head=document.createElement('div');
    head.className='menu-head';
    const back=document.createElement('button');
    back.className='menu-back';
    back.type='button';
    back.setAttribute('aria-label','Back to categories');
    back.textContent='‹';
    back.addEventListener('click',renderCategories);
    const headIcon=buildSafeImage(validImageSource(cat?.image_url),'', 'menu-head-icon',safeIcon(cat?.icon,'☕'));
    const headCopy=document.createElement('div');
    headCopy.className='menu-head-copy';
    const h2=document.createElement('h2'); h2.textContent=name;
    const hp=document.createElement('p'); hp.textContent=filtered.length+' item'+(filtered.length===1?'':'s');
    headCopy.append(h2,hp);
    head.append(back,headIcon,headCopy);
    itemsView.appendChild(head);

    const note=document.createElement('p');
    note.className='menu-small-note';
    note.textContent='Tap the back arrow to return to all categories.';
    itemsView.appendChild(note);

    const list=document.createElement('div');
    list.className='menu-list';
    if(!filtered.length){
      const empty=document.createElement('div'); empty.className='menu-empty'; empty.textContent='No items in this category yet.'; list.appendChild(empty);
    }else{
      filtered.forEach(item=>{
        const article=document.createElement('article'); article.className='menu-item';
        const itemSrc=validImageSource(item.image_url);
        article.appendChild(buildSafeImage(itemSrc,item.name||'Menu item','menu-item-image-wrap',cat?.icon||'☕'));
        const copy=document.createElement('div'); copy.className='menu-item-copy';
        const title=document.createElement('strong'); title.className='menu-item-name'; title.textContent=item.name||'Menu item'; copy.appendChild(title);
        if(item.description){ const d=document.createElement('small'); d.className='menu-item-description'; d.textContent=item.description; copy.appendChild(d); }
        const rawPrice=Number(item.price);
        if(Number.isFinite(rawPrice)){ const price=document.createElement('span'); price.className='menu-item-price'; price.textContent='AED '+rawPrice.toFixed(2); copy.appendChild(price); }
        article.appendChild(copy); list.appendChild(article);
      });
    }
    itemsView.appendChild(list);
  }

  async function loadMenu(){
    if(!window.sb) throw new Error('Supabase configuration is not available.');

    const categoryResult=await sb.from('menu_categories').select('*').order('sort_order',{ascending:true});
    if(categoryResult.error) throw categoryResult.error;

    const itemResult=await sb.from('menu_items').select('*').order('created_at',{ascending:true});
    if(itemResult.error) throw itemResult.error;

    categories=normalizeCategoryRows(Array.isArray(categoryResult.data)?categoryResult.data:[]);
    items=Array.isArray(itemResult.data)?itemResult.data:[];
    // If the database is empty, show the official AL NOOR menu catalog immediately.
    // Once GM imports/saves the catalog into Supabase, the live database becomes the source of truth.
    if(items.length===0 && Array.isArray(window.AL_NOOR_MENU_CATALOG)){
      items=window.AL_NOOR_MENU_CATALOG.map((item,i)=>({
        id:'catalog-'+i,
        name:item.name,
        category_name:item.category,
        description:item.description||'',
        price:item.price,
        image_url:null,
        status:'active',
        created_at:null
      }));
    }
    renderCategories();
  }

  loadMenu().catch(err=>{
    categories=FALLBACK_CATEGORIES.map(c=>({id:null,name:c.name,icon:c.icon,order:c.order,active:true,fallback:true,image_url:null}));
    items=[];
    categoriesView.hidden=false;
    itemsView.hidden=true;
    categoriesView.innerHTML='<div class="menu-error"><strong>Menu could not be loaded from the database.</strong><br>'+esc(err?.message||'Please try again later.')+'</div>';
  });
})();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));}
</script>
</body>
</html>
