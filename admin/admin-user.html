<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><link rel="manifest" href="../manifest.webmanifest"><title>Admin User</title><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script></head><body data-page="admin-user"><header class="topbar"><a class="brand brand-image" href="admin-dashboard.html"><img class="brand-logo" src="../assets/al-noor-approved-logo.png" alt="AL NOOR BAKERY & CAFE"></a><button class="icon" onclick="logout()" title="Sign out">↪</button></header><main class="container"><a class="btn soft" href="admin-users.html" style="margin-bottom:16px">← Back to Users</a><div id="adminUserPage"><div class="card"><div class="empty">Loading user…</div></div></div></main><nav class="nav"><div class="navin"><a href="admin-dashboard.html"><b>▦</b>Dashboard</a><a href="admin-users.html"><b>♙</b>Users</a><a href="admin-settings.html"><b>⚙</b>Settings</a></div></nav><script src="../assets/config.js"></script><script src="../assets/app.js?v=20261005-customer-session-isolation"></script><script>
(async function(){
  const escHtml=value=>String(value??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[m]));
  const id=new URLSearchParams(location.search).get("id"); const box=document.getElementById("adminUserPage");
  try{
    const admin=await guardRole(["admin"]); if(!admin)return;
    if(!id)throw new Error("User ID is missing.");
    const {data,error}=await sb.from("profiles").select("id,full_name,email,phone,member_id,role,points,is_active,created_at,avatar_url").eq("id",id).maybeSingle();
    if(error)throw error; if(!data)throw new Error("User not found.");
    const name=data.full_name||"User";
    document.title=`Admin — ${name}`;
    box.innerHTML=`<div class="card"><div class="profile-head" style="display:flex;align-items:center;gap:14px;margin-bottom:18px"><div class="avatar" style="width:72px;height:72px;border-radius:20px;overflow:hidden">${data.avatar_url?`<img src="${escHtml(data.avatar_url)}" alt="" style="width:100%;height:100%;object-fit:cover">`:escHtml((name||"AN").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase())}</div><div><h1 class="title" style="margin-bottom:4px">${escHtml(name)}</h1><span class="badge">${escHtml(String(data.role||"—").toLowerCase())}</span></div></div><div class="grid g2"><div><small>Member ID</small><strong style="display:block;margin-top:5px">${escHtml(data.member_id||"—")}</strong></div><div><small>Status</small><strong style="display:block;margin-top:5px">${data.is_active?"Active":"Inactive"}</strong></div><div><small>Email</small><strong style="display:block;margin-top:5px;word-break:break-word">${escHtml(data.email||"—")}</strong></div><div><small>Phone</small><strong style="display:block;margin-top:5px">${escHtml(data.phone||"—")}</strong></div><div><small>Points</small><strong style="display:block;margin-top:5px">${Number(data.points||0).toLocaleString()}</strong></div><div><small>Account Created</small><strong style="display:block;margin-top:5px">${data.created_at?escHtml(new Date(data.created_at).toLocaleString()):"—"}</strong></div></div></div>`;
  }catch(e){box.innerHTML=`<div class="card"><div class="alert">${escHtml(e.message||"Could not load user.")}</div></div>`;}
})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));}</script></body></html>
