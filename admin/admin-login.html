<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#073a2b">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="../assets/config.js"></script>
</head>
<body data-page="admin-login">
<div class="auth">
  <div class="authbox">
    <div class="logo">
      <div class="sun">☀</div>
      <h1>AL NOOR</h1>
      <small>LOYALTY</small>
    </div>
    <h2>Staff / GM Portal</h2>
    <p class="sub">Secure access for authorized Al Noor staff and management.</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" class="input" type="email" autocomplete="username" placeholder="name@alnoor.com">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password">
    </div>

    <button id="loginBtn" class="btn primary block" type="button">Sign In →</button>
    <div id="msg" class="note" aria-live="polite"></div>

    <div class="center" style="margin-top:14px">
      <a href="../index.html" class="sub">← Back</a>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const cfg = window.AL_NOOR_CONFIG || {};
  const url = cfg.SUPABASE_URL;
  const key = cfg.SUPABASE_PUBLISHABLE_KEY;

  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const button = document.getElementById("loginBtn");
  const msg = document.getElementById("msg");

  function showMessage(text, isError) {
    msg.textContent = text || "";
    msg.style.color = isError ? "#9b382e" : "";
  }

  if (!url || !key) {
    showMessage("Al Noor connection is not configured. Check assets/config.js.", true);
    button.disabled = true;
    return;
  }

  if (typeof window.supabase === "undefined") {
    showMessage("Al Noor service could not load. Please refresh the page.", true);
    button.disabled = true;
    return;
  }

  const sb = window.supabase.createClient(url, key, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });

  async function login() {
    const emailValue = email.value.trim().toLowerCase();
    const passwordValue = password.value;

    if (!emailValue) {
      showMessage("Please enter your email address.", true);
      email.focus();
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
      showMessage("Please enter a valid email address.", true);
      email.focus();
      return;
    }

    if (!passwordValue) {
      showMessage("Please enter your password.", true);
      password.focus();
      return;
    }

    button.disabled = true;
    button.textContent = "Signing in…";
    showMessage("Connecting to Al Noor Loyalty…", false);

    try {
      const { data, error } = await sb.auth.signInWithPassword({
        email: emailValue,
        password: passwordValue
      });

      if (error) throw error;

      if (!data || !data.session) {
        throw new Error("Login succeeded but no session was returned.");
      }

      let role = null;
      const profileResult = await sb.rpc("get_my_profile");

      if (!profileResult.error) {
        const profile = Array.isArray(profileResult.data)
          ? profileResult.data[0]
          : profileResult.data;
        role = String(profile?.role || "").toLowerCase();
      }

      if (role === "gm" || role === "admin" || role === "manager") {
        window.location.href = "../gm/gm-dashboard.html";
        return;
      }

      if (role === "staff" || role === "supervisor") {
        window.location.href = "../staff/staff-scan.html";
        return;
      }

      const staffResult = await sb.rpc("get_my_staff_profile");

      if (!staffResult.error && staffResult.data) {
        const staffProfile = Array.isArray(staffResult.data)
          ? staffResult.data[0]
          : staffResult.data;
        const staffRole = String(staffProfile?.role || "").toLowerCase();

        if (staffRole === "gm" || staffRole === "admin" || staffRole === "manager") {
          window.location.href = "../gm/gm-dashboard.html";
          return;
        }

        if (staffRole === "staff" || staffRole === "supervisor") {
          window.location.href = "../staff/staff-scan.html";
          return;
        }
      }

      await sb.auth.signOut();
      throw new Error("This account is not authorized for Staff or Management access.");

    } catch (err) {
      console.error("AL NOOR ADMIN LOGIN:", err);
      showMessage(err?.message || "Unable to sign in.", true);
      button.disabled = false;
      button.textContent = "Sign In →";
    }
  }

  button.addEventListener("click", login);

  [email, password].forEach(function (input) {
    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !button.disabled) login();
    });
  });
})();
</script>
</body>
</html>
