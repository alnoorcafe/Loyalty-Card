<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><title>Al Noor • Staff Offers</title><link rel="stylesheet" href="../../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="../../assets/config.js"></script><style>
:root{--green:#073b2b;--gold:#c9a96a;--ink:#211914;--muted:#766c61;--line:#ded4c5}.page{max-width:720px;margin:auto;padding:22px 15px 55px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font:700 24px Georgia,serif;color:var(--green);letter-spacing:2px}.brand small{display:block;font:700 9px Arial;letter-spacing:3px;color:#a98545}.back{color:var(--green);text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:12px;font-weight:700}.head h1{font:700 34px Georgia,serif;color:var(--green);margin:0 0 6px}.head p{color:var(--muted);font-size:13px;margin:0 0 20px}.offer{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:12px 0}.offer img{display:block;width:100%;height:190px;object-fit:cover;background:#eee}.body{padding:16px}.body h2{margin:0 0 7px;font:700 22px Georgia,serif;color:var(--green)}.body p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;white-space:pre-wrap}.tag{display:inline-block;margin-top:11px;background:#f2eadc;color:#765b31;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:800;letter-spacing:.7px}.empty{text-align:center;padding:35px 15px;background:#fff;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.error{text-align:center;padding:35px;color:#9b382e}
</style></head><body><main class="page"><div class="top"><div class="brand">AL NOOR<small>STAFF • VIEW ONLY</small></div><a class="back" href="staff-dashboard.html">Dashboard</a></div><header class="head"><h1>Offers</h1><p>Current active offers. Staff can view offers only.</p></header><section id="list"><div class="empty">Loading offers…</div></section></main><script>
(async function(){const cfg=window.AL_NOOR_CONFIG||{};const url=cfg.SUPABASE_URL,key=cfg.SUPABASE_PUBLISHABLE_KEY;const list=document.getElementById('list');if(!url||!key){list.innerHTML='<div class="error">Al Noor connection is not configured.</div>';return}const sb=supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('../admin-login.html');return}const profile=await sb.rpc('get_my_profile');const p=Array.isArray(profile.data)?profile.data[0]:profile.data;if(profile.error||!p||String(p.role||'').toLowerCase()!=='staff'||p.is_active===false){list.innerHTML='<div class="error">Staff access required.</div>';return}const now=new Date().toISOString();const {data,error}=await sb.from('offers').select('id,title,description,image_url,start_at,end_at').eq('is_active',true).lte('start_at',now).or('end_at.is.null,end_at.gte.'+now).order('sort_order',{ascending:true}).order('start_at',{ascending:false});if(error){list.innerHTML='<div class="error">'+String(error.message).replace(/[<>]/g,'')+'</div>';return}if(!data?.length){list.innerHTML='<div class="empty">No active offers right now.</div>';return}const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));list.innerHTML=data.map(o=>`<article class="offer">${o.image_url?`<img src="${esc(o.image_url)}" alt="${esc(o.title)}" onerror="this.style.display='none'">`:''}<div class="body"><h2>${esc(o.title)}</h2><p>${esc(o.description||'')}</p>${o.end_at?`<span class="tag">VALID UNTIL ${esc(new Date(o.end_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase())}</span>`:''}</div></article>`).join('')})();
</script></body></html>
