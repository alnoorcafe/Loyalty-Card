<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><meta name="description" content="AL NOOR Bakery & Cafe public menu"><title>AL NOOR Menu</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="../assets/config.js?v=20261006-public-menu-14-final"></script>
<script>
/* Public Menu resilience: keep the exact existing Supabase settings available even if the relative config file is not served by a mobile cache/path. */
window.AL_NOOR_CONFIG = window.AL_NOOR_CONFIG || Object.freeze({
  SUPABASE_URL: "https://hlzmnbmngsbvnlnaaoau.supabase.co",
  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_U6m9qKom9eie1n9Q1SSQRA_A3k3vImH"
});
</script>
<style>
:root{--cream:#f7f1e7;--green:#073a2b;--gold:#c9ae70;--muted:#718078;--line:#e5dfd4;--card:#fffdf8}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--cream);color:var(--green);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.page{max-width:1000px;margin:0 auto;padding:30px 16px 50px}.hero{margin-bottom:24px}.eyebrow{margin:0 0 7px;color:var(--gold);font-size:12px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase}.title{margin:0;font-family:Georgia,serif;font-size:48px;line-height:1.05}.sub{margin:10px 0 0;color:var(--muted);font-size:18px}.panel{background:rgba(255,253,248,.94);border:1px solid #ded9cf;border-radius:28px;padding:18px;box-shadow:0 10px 35px rgba(33,45,39,.06)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cat{position:relative;display:block;width:100%;height:230px;padding:0;border:1px solid rgba(7,58,43,.12);border-radius:22px;overflow:hidden;background:#efe4d1;cursor:pointer;box-shadow:0 7px 20px rgba(19,48,37,.06)}.cat img{width:100%;height:100%;display:block;object-fit:cover}.cat::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.72))}.cat-name{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:18px 14px 13px;color:#fff;font-size:17px;font-weight:900;text-align:left;text-shadow:0 1px 3px #000}.cat-count{display:none!important;visibility:hidden!important;width:0!important;height:0!important;padding:0!important;margin:0!important;overflow:hidden!important}.loading,.error,.empty{text-align:center;padding:35px 15px;color:var(--muted);font-weight:700}.error{color:#8b3a31;background:#fff7f5;border-radius:18px}.head{display:flex;align-items:center;gap:12px;padding-bottom:15px;border-bottom:1px solid var(--line)}.back{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:#edf2eb;color:var(--green);font-size:28px;cursor:pointer}.head h2{margin:0;font-size:24px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:700}.items{display:grid}.item{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-img{width:92px;height:92px;flex:0 0 92px;border-radius:18px;object-fit:cover;background:#efe4d1;border:1px solid rgba(7,58,43,.1)}.item-copy{min-width:0;flex:1}.item-name{display:block;font-size:17px;font-weight:900}.item-desc{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.45}.price{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#edf4ed;font-size:12px;font-weight:900}.no-image{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:800;text-align:center;padding:8px}.hidden{display:none!important}@media(max-width:600px){.page{padding:24px 12px 36px}.title{font-size:38px}.sub{font-size:15px}.panel{padding:10px;border-radius:22px}.grid{gap:10px}.cat{height:190px;border-radius:20px}.cat-name{font-size:14px;padding:14px 10px 10px}.items{grid-template-columns:1fr;gap:12px}.item-img{width:74px;height:74px;flex-basis:74px}.item-name{font-size:15px}}
</style></head><body><main class="page"><section class="hero"><p class="eyebrow">AL NOOR BAKERY &amp; CAFE</p><h1 class="title">Our Menu</h1><p class="sub">Choose a category to view the available items.</p></section><section class="panel"><div id="categories" class="loading">Loading menu…</div><div id="items" class="hidden"></div></section></main>
<script>
(function(){
const CATEGORY_IMAGE_FILES={
  "Classic Coffee":"01_Classic_Coffee.png",
  "Craft Pour Over V60":"02_Craft_Pour_Over_V60.png",
  "Iced Coffee":"03_Iced_Coffee.png",
  "Matcha":"04_Matcha.png",
  "Breakfast":"05_Breakfast.png",
  "Paninis Wraps Toast":"06_Paninis_Wraps_Toast.png",
  "Fresh Salads":"07_Fresh_Salads.png",
  "Artisanal Pizzas":"08_Artisanal_Pizzas.png",
  "Manakish":"09_Manakish.png",
  "Bakery Croissants":"10_Bakery_Croissants.png",
  "Cakes Pastries":"11_Cakes_Pastries.png",
  "Fresh Juices Wellness":"12_Fresh_Juices_Wellness.png",
  "Acai":"13_Acai.png",
  "Mojitos Iced Teas":"14_Mojitos_Iced_Teas.png"
};
const categoriesEl=document.getElementById('categories'),itemsEl=document.getElementById('items');let categories=[],items=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const norm=v=>String(v??'').trim().toLowerCase().replace(/&/g,' and ').replace(/[–—]/g,'-').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const imageValue=o=>{const vals=[o?.image_url,o?.imageUrl,o?.image,o?.photo_url,o?.photo,o?.image_path];return vals.find(v=>typeof v==='string'&&v.trim())?.trim()||''};
const validImage=src=>/^(https?:\/\/|data:image\/|\/|\.\.?\/)/i.test(src||'');
function categoryImage(c){
  const direct=imageValue(c);
  if(validImage(direct)) return direct;
  const n=c?.name||c?.title||'';
  const key=Object.keys(CATEGORY_IMAGE_FILES).find(k=>norm(k)===norm(n));
  if(!key) return '';
  const base=(location.pathname.includes('/menu/') ? '../' : '');
  return base+'assets/menu-categories/'+CATEGORY_IMAGE_FILES[key];
}
function itemCategoryId(it){return it?.category_id??it?.categoryId??it?.category_uuid??null}
function itemBelongs(it,c){const iid=itemCategoryId(it);if(iid!=null&&c?.id!=null&&String(iid).toLowerCase()===String(c.id).toLowerCase())return true;const vals=[it?.category_name,it?.categoryName,it?.category_key,it?.category_slug,it?.category,it?.category?.name,it?.category?.title];return vals.some(v=>norm(v)===norm(c?.name))}
function itemsFor(c){return items.filter(it=>itemBelongs(it,c))}
function renderCategories(){itemsEl.classList.add('hidden');categoriesEl.classList.remove('hidden');categoriesEl.className='grid';if(!categories.length){categoriesEl.className='empty';categoriesEl.textContent='No menu categories found.';return}categoriesEl.innerHTML=categories.map((c,i)=>{const img=categoryImage(c),name=c.name||c.title||('Category '+(i+1));const image=validImage(img)?'<img src="'+esc(img)+'" alt="'+esc(name)+'" loading="eager">':'<div class="no-image">No category image</div>';return '<button class="cat" type="button" data-index="'+i+'">'+image+'<span class="cat-name">'+esc(name)+'</span></button>'}).join('');categoriesEl.querySelectorAll('.cat').forEach(b=>b.addEventListener('click',()=>renderItems(categories[Number(b.dataset.index)])))}
function renderItems(c){
 const name=c?.name||c?.title||'Category',rows=itemsFor(c);
 categoriesEl.classList.add('hidden');itemsEl.classList.remove('hidden');
 let out='<div class="head"><button class="back" type="button" aria-label="Back">‹</button><div><h2>'+esc(name)+'</h2><p>'+rows.length+' item'+(rows.length===1?'':'s')+'</p></div></div>';
 if(!rows.length) out+='<div class="empty">No items in this category yet.</div>';
 else out+='<div class="items">'+rows.map(it=>{
   const raw=imageValue(it),src=validImage(raw)?raw:'';
   const img=src?'<img class="item-img" src="'+esc(src)+'" alt="'+esc(it.name||'Menu item')+'" loading="lazy">':'<div class="item-img no-image"></div>';
   const price=Number.isFinite(Number(it.price))?'<span class="price">AED '+Number(it.price).toFixed(2)+'</span>':'';
   const desc=it.description?'<span class="item-desc">'+esc(it.description)+'</span>':'';
   return '<article class="item">'+img+'<div class="item-copy"><strong class="item-name">'+esc(it.name||'Menu item')+'</strong>'+desc+price+'</div></article>';
 }).join('')+'</div>';
 itemsEl.innerHTML=out;itemsEl.querySelector('.back').addEventListener('click',renderCategories);
}
async function load(){
  try{
    const cfg=window.AL_NOOR_CONFIG;
    if(!cfg?.SUPABASE_URL||!cfg?.SUPABASE_PUBLISHABLE_KEY) throw new Error('Menu configuration is unavailable.');
    const headers={apikey:cfg.SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+cfg.SUPABASE_PUBLISHABLE_KEY,Accept:'application/json'};
    const api=async(path)=>{const r=await fetch(cfg.SUPABASE_URL+'/rest/v1/'+path,{method:'GET',headers,cache:'no-store'});if(!r.ok)throw new Error('Supabase request failed ('+r.status+')');return r.json()};
    let categoryData=[],itemData=[];
    try{
      categoryData=await api('menu_categories?select=*&order=sort_order.asc');
      itemData=await api('menu_items?select=*&order=created_at.asc');
    }catch(restErr){
      if(!window.supabase) throw restErr;
      const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY);
      const cr=await sb.from('menu_categories').select('*').order('sort_order',{ascending:true});
      if(cr.error)throw cr.error;
      const ir=await sb.from('menu_items').select('*').order('created_at',{ascending:true});
      if(ir.error)throw ir.error;
      categoryData=cr.data; itemData=ir.data;
    }
    categories=Array.isArray(categoryData)?categoryData:[];
    items=Array.isArray(itemData)?itemData:[];
    /* UI fallback only: if Safari/mobile receives an empty menu_categories response,
       keep the original 14 public categories visible in the exact DB order.
       This never creates, deletes, or changes anything in Supabase. Items are still
       loaded from menu_items and linked by category_id/category name when available. */
    if(!categories.length){
      const names=['Classic Coffee','Craft Pour Over V60','Iced Coffee','Matcha','Breakfast','Paninis Wraps Toast','Fresh Salads','Artisanal Pizzas','Manakish','Bakery Croissants','Cakes Pastries','Fresh Juices Wellness','Acai','Mojitos Iced Teas'];
      categories=names.map((name,i)=>({id:null,name,sort_order:i+1,__uiFallback:true}));
    }
    renderCategories();
  }catch(e){categoriesEl.className='error';categoriesEl.textContent='Menu could not be loaded: '+(e?.message||'Unknown error')}}
load();
})();
</script></body></html>
