<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><link rel="manifest" href="../manifest.webmanifest"><title>Offers Management</title><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script></head><body data-page="gm-offers"><header class="topbar"><a class="brand brand-image" href="gm-dashboard.html"><img class="brand-logo" src="../assets/al-noor-approved-logo.png" alt="AL NOOR BAKERY & CAFE"></a><button class="icon" onclick="logout()">↪</button></header><main class="container"><h1 class="title">Offers Management</h1><p class="sub">Manage products and offer date limits.</p>
<div class="card"><h3>Add / Edit Offer</h3>
<div class="field"><label>Product Name</label><input class="input" id="gmOfferName" placeholder="Product name"></div>
<div class="field"><label>Description</label><input class="input" id="gmOfferDescription" placeholder="Offer description"></div>
<div class="field"><label>Production Date</label><input class="input" id="gmOfferProduction" type="date"></div>
<div class="field"><label>Expiry Date</label><input class="input" id="gmOfferExpiry" type="date"></div>
<div class="field"><label>Status</label><select class="input" id="gmOfferStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
<button class="btn primary block" id="saveOfferBtn">SAVE OFFER</button>
<div id="offerMsg" class="note">Products are saved with production and expiry dates.</div></div>
<div class="card"><h3>Current Offers</h3><div id="gmOffersList"><div class="empty">Loading offers…</div></div></div>
</main><nav class="nav"><div class="navin"><a href="gm-dashboard.html"><b>⌂</b>Dashboard</a><a href="gm-members.html"><b>●</b>Members</a><a href="gm-reports.html"><b>▤</b>Reports</a><a href="gm-offers.html" class="active"><b>✦</b>Offers</a><a href="gm-settings.html"><b>⚙</b>More</a></div></nav>
<script src="../assets/config.js"></script>
<script src="../assets/app.js"></script>
<script>
(function(){
 const msg=document.getElementById("offerMsg"), list=document.getElementById("gmOffersList");
 function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#039;"}[m]))}
 function render(rows){list.innerHTML=rows?.length?rows.map(r=>`<div class="reward"><div class="grow"><strong>${esc(r.product_name)}</strong><small>${esc(r.description||"")}<br>Production: ${esc(r.production_date||"—")} • Expiry: ${esc(r.expiry_date||"—")}</small></div><span class="badge">${esc(r.status)}</span></div>`).join(""):"<div class=\"empty\">No offers yet.</div>"}
 async function load(){const {data,error}=await sb.from("offers").select("id,product_name,description,production_date,expiry_date,status").order("created_at",{ascending:false}); if(error){list.innerHTML=`<div class=\"alert\">${esc(error.message)}</div>`;return} render(data||[])}
 document.getElementById("saveOfferBtn").onclick=async()=>{const product_name=document.getElementById("gmOfferName").value.trim(),description=document.getElementById("gmOfferDescription").value.trim(),production_date=document.getElementById("gmOfferProduction").value,expiry_date=document.getElementById("gmOfferExpiry").value,status=document.getElementById("gmOfferStatus").value; if(!product_name||!production_date||!expiry_date){msg.textContent="Product name, production date and expiry date are required.";return} if(expiry_date<production_date){msg.textContent="Expiry date cannot be before production date.";return} const profile=await getStaffProfile(); const {error}=await sb.from("offers").insert({product_name,description,production_date,expiry_date,status,created_by:profile?.id||null}); if(error){msg.textContent=error.message;return} msg.textContent="Offer saved successfully."; document.getElementById("gmOfferName").value="";document.getElementById("gmOfferDescription").value="";document.getElementById("gmOfferProduction").value="";document.getElementById("gmOfferExpiry").value="";await load()};
 load();
})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));}</script></body></html>
