        Category

            max-width:420px;

            object-fit:cover;

            border:1px solid rgba(0,0,0,.12);

        class="input"

        class="note"

      <div

          margin-top:12px;
          display:none;
        "

          id="gmMenuPreviewImage"

          style="
            display:block;
            width:100%;
            max-width:360px;
            height:180px;
            object-fit:cover;
            border-radius:14px;
            border:1px solid rgba(0,0,0,.12);
          "
        >

      </div>

    </div>


    <div class="field">

      <label for="gmMenuStatus">
        Status
      </label>

      <select
        class="input"
        id="gmMenuStatus"
      >
        <option value="active">
          Active
        </option>

        <option value="inactive">
          Inactive
        </option>
      </select>

    </div>


    <button
      class="btn primary block"
      id="saveMenuBtn"

<script src="../assets/app.js?v=20261005-menu"></script>


<script>

(function () {

  "use strict";


  /* =====================================================
     HELPERS
     ===================================================== */

  const $ = id =>
    document.getElementById(id);


  const esc = value =>
    String(value ?? "").replace(
      /[&<>"']/g,
      function (m) {

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[m];

      }
    );


  let categories = [];
  let items = [];


  let currentCategoryImage = null;
  let selectedCategoryImage = null;


  let currentMenuImage = null;
  let selectedMenuImage = null;



  /* =====================================================
     CATEGORY SELECTS
     ===================================================== */

  function fillCategories() {

    const selects = [
      $("gmMenuCategory"),
      $("gmItemCategory")
    ];


    selects.forEach(function (select) {

      if (!select) return;


      select.innerHTML =
        '<option value="">Select category</option>' +

        categories
          .map(function (category) {

            return (
              '<option value="' +
              esc(category.id) +
              '">' +
              esc(category.name) +
              "</option>"
            );

          })
          .join("");

    });

  }



  /* =====================================================
     LOAD CATEGORIES
     ===================================================== */

  async function loadCategories() {

    let result;


    /*
      First attempt:
      normal query with sort_order.
    */

    result = await sb
      .from("menu_categories")
      .select("*")
      .order("sort_order", {
        ascending: true
      });


    /*
      If sort_order causes a database error,
      retry without ordering.

      This prevents:
      "Unable to load categories"
    */

    if (result.error) {

      result = await sb
        .from("menu_categories")
        .select("*");

    }


    if (result.error) {

      $("gmMenuCategory").innerHTML =
        '<option value="">Unable to load categories</option>';


      $("gmItemCategory").innerHTML =
        '<option value="">Unable to load categories</option>';


      $("menuMsg").textContent =
        "Could not load categories: " +
        (
          result.error.message ||
          "Unknown database error"
        );


      return false;

    }


    categories = Array.isArray(result.data)
      ? result.data.filter(function (category) {

          return (
            category &&
            category.is_active !== false
          );

        })
      : [];


    /*
      Sort in browser if sort_order exists.
    */

    categories.sort(function (a, b) {

      return (
        Number(a.sort_order ?? 999999) -
        Number(b.sort_order ?? 999999)
      );

    });


    fillCategories();


    return true;

  }



  /* =====================================================
     IMAGE PREVIEW
     ===================================================== */

  function showPreview(
    wrapperId,
    imageId,
    src
  ) {

    const wrapper = $(wrapperId);
    const image = $(imageId);


    if (!wrapper || !image) return;


    if (!src) {

      wrapper.style.display = "none";
      image.removeAttribute("src");

      return;

    }


    image.src = src;

    wrapper.style.display = "block";

  }



  /* =====================================================
     IMAGE FILE → DATA URL
     ===================================================== */

  async function fileToDataUrl(
    file,
    maxSize = 5 * 1024 * 1024,
    maxDimension = 900,
    quality = 0.82
  ) {

    if (!file) {

      throw new Error(
        "Please choose an image."
      );

    }


    if (!file.type.startsWith("image/")) {

      throw new Error(
        "Please choose an image file."
      );

    }


    if (file.size > maxSize) {

      throw new Error(
        "Image must be 5 MB or smaller."
      );

    }


    const raw = await new Promise(
      function (resolve, reject) {

        const reader =
          new FileReader();


        reader.onload =
          function () {

            resolve(
              reader.result
            );

          };


        reader.onerror =
          function () {

            reject(
              new Error(
                "Could not read image."
              )
            );

          };


        reader.readAsDataURL(file);

      }
    );


    /*
      Create image for resizing.
    */

    const image = await new Promise(
      function (resolve, reject) {

        const img =
          new Image();


        img.onload =
          function () {

            resolve(img);

          };


        img.onerror =
          function () {

            reject(
              new Error(
                "Invalid image."
              )
            );

          };


        img.src = raw;

      }
    );


    const scale =
      Math.min(
        1,
        maxDimension /
        Math.max(
          image.width,
          image.height
        )
      );


    const canvas =
      document.createElement("canvas");


    canvas.width =
      Math.max(
        1,
        Math.round(
          image.width * scale
        )
      );


    canvas.height =
      Math.max(
        1,
        Math.round(
          image.height * scale
        )
      );


    const context =
      canvas.getContext("2d");


    context.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
      Save as compressed JPEG data URL.

      This is stored in image_url.
      No external URL is required.
    */

    return canvas.toDataURL(
      "image/jpeg",
      quality
    );

  }



  /* =====================================================
     CATEGORY CHANGE
     ===================================================== */

  $("gmMenuCategory").addEventListener(
    "change",
    function () {

      const id =
        $("gmMenuCategory").value;


      const category =
        categories.find(
          function (item) {

            return String(item.id) ===
              String(id);

          }
        );


      currentCategoryImage =
        category?.image_url ||
        null;


      selectedCategoryImage =
        null;


      $("gmCategoryImageFile").value =
        "";


      $("gmCategoryImageName").textContent =
        currentCategoryImage
          ? "Current image loaded. Choose a new file to replace it."
          : "No image yet. Choose an image from your device.";


      showPreview(
        "gmCategoryPreview",
        "gmCategoryPreviewImage",
        currentCategoryImage
      );

    }
  );



  /* =====================================================
     CATEGORY IMAGE SELECT
     ===================================================== */

  $("gmCategoryImageFile").addEventListener(
    "change",
    async function (event) {

      try {

        const file =
          event.target.files?.[0];


        if (!file) return;


        selectedCategoryImage =
          await fileToDataUrl(file);


        $("gmCategoryImageName").textContent =
          "New image selected: " +
          file.name;


        showPreview(
          "gmCategoryPreview",
          "gmCategoryPreviewImage",
          selectedCategoryImage
        );


        $("menuMsg").textContent =
          "New category image selected. Press SAVE CATEGORY.";

      }
      catch (error) {

        selectedCategoryImage =
          null;


        event.target.value =
          "";


        $("menuMsg").textContent =
          error.message ||
          "Could not load image.";

      }

    }
  );



  /* =====================================================
     SAVE CATEGORY
     ===================================================== */

  $("saveCategoryBtn").addEventListener(
    "click",
    async function () {

      const button =
        $("saveCategoryBtn");


      const categoryId =
        $("gmMenuCategory").value;


      if (!categoryId) {

        $("menuMsg").textContent =
          "Select a category first.";

        return;

      }


      /*
        Important:

        If a new image was selected:
        use it.

        If no new image:
        keep the existing image.

        If the category has no image:
        save NULL.
      */

      const imageUrl =
        selectedCategoryImage !== null
          ? selectedCategoryImage
          : currentCategoryImage;


      button.disabled = true;
      button.textContent = "SAVING...";


      try {

        const profile =
          await getProfile();


        if (
          !profile ||
          !["gm", "admin"].includes(
            profile.role
          )
        ) {

          throw new Error(
            "GM access is required."
          );

        }


        const result =
          await sb
            .from("menu_categories")
            .update({
              image_url: imageUrl || null
            })
            .eq(
              "id",
              categoryId
            );


        if (result.error) {

          throw result.error;

        }


        /*
          Update local state immediately.
        */

        const category =
          categories.find(
            function (item) {

              return String(item.id) ===
                String(categoryId);

            }
          );


        if (category) {

          category.image_url =
            imageUrl || null;

        }


        currentCategoryImage =
          imageUrl || null;


        selectedCategoryImage =
          null;


        $("gmCategoryImageFile").value =
          "";


        $("gmCategoryImageName").textContent =
          imageUrl
            ? "Category image saved. Choose another file to replace it."
            : "No category image.";


        showPreview(
          "gmCategoryPreview",
          "gmCategoryPreviewImage",
          imageUrl
        );


        $("menuMsg").textContent =
          "Category image saved successfully.";

      }
      catch (error) {

        $("menuMsg").textContent =
          "Could not save category: " +
          (
            error?.message ||
            "Unknown error"
          );

      }
      finally {

        button.disabled = false;
        button.textContent =
          "SAVE CATEGORY";

      }

    }
  );



  /* =====================================================
     ITEM IMAGE SELECT
     ===================================================== */

  $("gmMenuImageFile").addEventListener(
    "change",
    async function (event) {

      try {

        const file =
          event.target.files?.[0];


        if (!file) return;


        selectedMenuImage =
          await fileToDataUrl(file);


        $("gmMenuImageName").textContent =
          "New image selected: " +
          file.name;


        showPreview(
          "gmMenuImagePreview",
          "gmMenuPreviewImage",
          selectedMenuImage
        );


        $("menuMsg").textContent =
          "New item image selected. Press SAVE MENU ITEM.";

      }
      catch (error) {

        selectedMenuImage =
          null;


        event.target.value =
          "";


        $("menuMsg").textContent =
          error.message ||
          "Could not load image.";

      }

    }
  );



  /* =====================================================
     LOAD MENU ITEMS
     ===================================================== */

  async function loadItems() {

    const result =
      await sb
        .from("menu_items")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (result.error) {

      $("gmMenuList").innerHTML =
        '<div class="alert">' +
        esc(result.error.message) +
        "</div>";

      return;

    }


    items =
      Array.isArray(result.data)
        ? result.data
        : [];


    if (!items.length) {

      $("gmMenuList").innerHTML =
        '<div class="empty">No menu items yet.</div>';

      return;

    }


    $("gmMenuList").innerHTML =
      items
        .map(function (item) {

          const category =
            categories.find(
              function (category) {

                return String(category.id) ===
                  String(item.category_id);

              }
            );


          const image =
            item.image_url
              ? (
                  '<img ' +
                  'class="reward-product-image" ' +
                  'src="' +
                  esc(item.image_url) +
                  '" ' +
                  'alt="' +
                  esc(item.name) +
                  '">'
                )
              : '<div class="food">☕</div>';


          return (

            '<div class="reward">' +

              image +

              '<div class="grow">' +

                '<strong>' +
                  esc(item.name) +
                '</strong>' +

                '<small>' +

                  esc(
                    category?.name ||
                    "No category"
                  ) +

                  "<br>" +

                  esc(
                    item.description ||
                    ""
                  ) +

                  "<br>" +

                  "AED " +
                  Number(
                    item.price || 0
                  ).toFixed(2) +

                "</small>" +

              "</div>" +

              '<span class="badge">' +
                esc(
                  item.status ||
                  ""
                ) +
              "</span>" +

              '<div style="display:flex;gap:6px;margin-left:8px">' +

                '<button class="btn" data-edit="' +
                  esc(item.id) +
                '">' +
                  "EDIT" +
                "</button>" +

                '<button class="btn" data-delete="' +
                  esc(item.id) +
                '">' +
                  "DELETE" +
                "</button>" +

              "</div>" +

            "</div>"

          );

        })
        .join("");


    $("gmMenuList")
      .querySelectorAll(
        "[data-edit]"
      )
      .forEach(
        function (button) {

          button.onclick =
            function () {

              editItem(
                button.dataset.edit
              );

            };

        }
      );


    $("gmMenuList")
      .querySelectorAll(
        "[data-delete]"
      )
      .forEach(
        function (button) {

          button.onclick =
            function () {

              deleteItem(
                button.dataset.delete
              );

            };

        }
      );

  }



  /* =====================================================
     EDIT ITEM
     ===================================================== */

  function editItem(id) {

    const item =
      items.find(
        function (row) {

          return String(row.id) ===
            String(id);

        }
      );


    if (!item) return;


    $("gmMenuId").value =
      item.id;


    $("gmItemCategory").value =
      item.category_id || "";


    $("gmMenuName").value =
      item.name || "";


    $("gmMenuDescription").value =
      item.description || "";


    $("gmMenuPrice").value =
      item.price ?? "";


    $("gmMenuStatus").value =
      item.status || "active";


    currentMenuImage =
      item.image_url ||
      null;


    selectedMenuImage =
      null;


    $("gmMenuImageFile").value =
      "";


    $("gmMenuImageName").textContent =
      currentMenuImage
        ? "Current image loaded. Choose a new file to replace it."
        : "Choose an image from your device.";


    showPreview(
      "gmMenuImagePreview",
      "gmMenuPreviewImage",
      currentMenuImage
    );


    $("cancelEditBtn").style.display =
      "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }



  /* =====================================================
     CLEAR ITEM FORM
     ===================================================== */

  function clearForm() {

    $("gmMenuId").value =
      "";


    $("gmItemCategory").value =
      "";


    $("gmMenuName").value =
      "";


    $("gmMenuDescription").value =
      "";


    $("gmMenuPrice").value =
      "";


    $("gmMenuStatus").value =
      "active";


    $("gmMenuImageFile").value =
      "";


    $("gmMenuImageName").textContent =
      "Choose an image from your device.";


    currentMenuImage =
      null;


    selectedMenuImage =
      null;


    showPreview(
      "gmMenuImagePreview",
      "gmMenuPreviewImage",
      null
    );


    $("cancelEditBtn").style.display =
      "none";

  }



  /* =====================================================
     DELETE ITEM
     ===================================================== */

  async function deleteItem(id) {

    if (
      !confirm(
        "Delete this menu item?"
      )
    ) {

      return;

    }


    const result =
      await sb
        .from("menu_items")
        .delete()
        .eq("id", id);


    if (result.error) {

      $("menuMsg").textContent =
        result.error.message;

      return;

    }


    $("menuMsg").textContent =
      "Menu item deleted successfully.";


    await loadItems();

  }



  /* =====================================================
     SAVE MENU ITEM
     ===================================================== */

  $("saveMenuBtn").addEventListener(
    "click",
    async function () {

      const id =
        $("gmMenuId").value.trim();


      const categoryId =
        $("gmItemCategory").value;


      const name =
        $("gmMenuName")
          .value
          .trim();


      const description =
        $("gmMenuDescription")
          .value
          .trim();


      const price =
        Number(
          $("gmMenuPrice").value
        );


      const status =
        $("gmMenuStatus").value;


      if (!categoryId) {

        $("menuMsg").textContent =
          "Select a category.";

        return;

      }


      if (!name) {

        $("menuMsg").textContent =
          "Item name is required.";

        return;

      }


      if (
        !Number.isFinite(price) ||
        price < 0
      ) {

        $("menuMsg").textContent =
          "Enter a valid price.";

        return;

      }


      const profile =
        await getProfile();


      if (
        !profile ||
        !["gm", "admin"].includes(
          profile.role
        )
      ) {

        $("menuMsg").textContent =
          "GM access is required.";

        return;

      }


      /*
        Keep old image if user did not
        select another one.
      */

      const imageUrl =
        selectedMenuImage !== null
          ? selectedMenuImage
          : currentMenuImage;


      const payload = {

        category_id:
          categoryId,

        name:
          name,

        description:
          description || null,

        price:
          price,

        image_url:
          imageUrl || null,

        status:
          status

      };


      let result;


      if (id) {

        result =
          await sb
            .from("menu_items")
            .update(payload)
            .eq("id", id);

      }
      else {

        result =
          await sb
            .from("menu_items")
            .insert({
              ...payload,
              created_by:
                profile.id
            });

      }


      if (result.error) {

        $("menuMsg").textContent =
          result.error.message;

        return;

      }


      $("menuMsg").textContent =
        id
          ? "Menu item updated successfully."
          : "Menu item saved successfully.";


      clearForm();


      await loadItems();

    }
  );



  /* =====================================================
     CANCEL EDIT
     ===================================================== */

  $("cancelEditBtn").addEventListener(
    "click",
    clearForm
  );



  /* =====================================================
     INITIALIZE
     ===================================================== */

  (async function () {

    /*
      GM + Admin are allowed to use
      this management page.
    */

    const profile =
      await guardRole([
        "gm",
        "admin"
      ]);


    if (!profile) return;


    const categoriesLoaded =
      await loadCategories();


    if (!categoriesLoaded) {

      return;

    }


    await loadItems();

  })();


})();



/* =====================================================
   SERVICE WORKER
   ===================================================== */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function () {

      navigator.serviceWorker
