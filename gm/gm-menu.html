<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><meta name="description" content="AL NOOR GM Menu Management"><link rel="manifest" href="../manifest.webmanifest"><title>AL NOOR — Menu Management</title><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script></head><body data-page="gm-menu"><header class="topbar"><a class="brand brand-image" href="gm-dashboard.html"><img class="brand-logo" src="../assets/al-noor-approved-logo.png" alt="AL NOOR BAKERY & CAFE"></a><button class="icon" onclick="logout()">↪</button></header><main class="container"><h1 class="title">Menu Management</h1><p class="sub">Manage categories, products, prices, images, availability, and official menu import.</p>
<div class="card"><h3>Category</h3><div class="field"><label>Category Name</label><input class="input" id="gmCategoryName" placeholder="Enter category name"></div><div class="field"><label>Category Image</label><input class="input" id="gmCategoryImageFile" type="file" accept="image/*"><small class="note" id="gmCategoryImageNote">Choose an image (optional).</small></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="saveCategoryBtn" type="button">SAVE CATEGORY</button><button class="btn" id="deleteCategoryBtn" type="button">DELETE CATEGORY</button></div></div>
<div class="card"><h3>Add / Edit Menu Item</h3><input type="hidden" id="gmMenuId"><div class="field"><label>Category</label><select class="input" id="gmItemCategory"><option value="">Loading categories…</option></select></div><div class="field"><label>Item Name</label><input class="input" id="gmMenuName" placeholder="e.g. Spanish Latte"></div><div class="field"><label>Description</label><input class="input" id="gmMenuDescription" placeholder="Short product description"></div><div class="field"><label>Price (AED)</label><input class="input" id="gmMenuPrice" type="number" step="0.01" min="0" placeholder="18"></div><div class="field"><label>Image URL (optional)</label><input class="input" id="gmMenuImage" placeholder="https://..."></div><div class="field"><label>Status</label><select class="input" id="gmMenuStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div><button class="btn primary block" id="saveMenuBtn">SAVE MENU ITEM</button><button class="btn block" id="cancelEditBtn" style="display:none;margin-top:8px">CANCEL EDIT</button><div id="menuMsg" class="note">Use IMPORT OFFICIAL AL NOOR MENU to load the official 87-item menu.</div></div>

<div class="card"><h3>Current Menu</h3><div id="gmMenuList"><div class="empty">Loading menu…</div></div></div></main><nav class="nav"><div class="navin"><a href="gm-dashboard.html"><b>⌂</b>Dashboard</a><a href="gm-members.html"><b>●</b>Customers</a><a href="gm-menu.html" class="active"><b>✦</b>Menu</a><a href="gm-settings.html"><b>⚙</b>More</a></div></nav>
<script src="../assets/config.js"></script><script src="../assets/app.js?v=20261006-role-isolation"></script>
<script>
(function(){
 const $=id=>document.getElementById(id), esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
  let categories=[], items=[];
 function fillCategories(){ const s=$("gmItemCategory"); s.innerHTML='<option value="">Select category</option>'+categories.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join(""); }
 async function loadCategories(){ const {data,error}=await sb.from("menu_categories").select("id,name,image_url,status").order("name"); if(error){$("menuMsg").textContent=error.message;return false} categories=data||[]; fillCategories(); return true; }
 async function loadItems(){ const {data,error}=await sb.from("menu_items").select("id,name,description,price,image_url,status,category_id,created_at").order("created_at",{ascending:false}); if(error){$("gmMenuList").innerHTML='<div class="alert">'+esc(error.message)+'</div>';return} items=data||[]; $("gmMenuList").innerHTML=items.length?items.map(r=>'<div class="reward">'+(r.image_url?'<img class="reward-product-image" src="'+esc(r.image_url)+'" alt="'+esc(r.name)+'">':'<div class="food">☕</div>')+'<div class="grow"><strong>'+esc(r.name)+'</strong><small>'+esc((categories.find(c=>c.id===r.category_id)||{}).name||"No category")+'<br>'+esc(r.description||"")+'<br>'+(r.price_display?esc(r.price_display):'AED '+Number(r.price||0).toFixed(2))+'</small></div><span class="badge">'+esc(r.status||"")+'</span><div style="display:flex;gap:6px;margin-left:8px"><button class="btn" data-edit="'+esc(r.id)+'">EDIT</button><button class="btn" data-delete="'+esc(r.id)+'">DELETE</button></div></div>').join(""):'<div class="empty">No menu items yet.</div>'; $("gmMenuList").querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(b.dataset.edit)); $("gmMenuList").querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteItem(b.dataset.delete)); }
 function editItem(id){const r=items.find(x=>x.id===id);if(!r)return; $("gmMenuId").value=r.id;$("gmItemCategory").value=r.category_id||"";$("gmMenuName").value=r.name||"";$("gmMenuDescription").value=r.description||"";$("gmMenuPrice").value=r.price??"";$("gmMenuImage").value=r.image_url||"";$("gmMenuStatus").value=r.status||"active";$("cancelEditBtn").style.display="block";window.scrollTo({top:0,behavior:"smooth"});}
 function clearForm(){$("gmMenuId").value="";["gmMenuName","gmMenuDescription","gmMenuPrice","gmMenuImage"].forEach(id=>$(id).value="");$("gmItemCategory").value="";$("gmMenuStatus").value="active";$("cancelEditBtn").style.display="none";}
 async function deleteItem(id){if(!confirm("Delete this menu item?"))return;const {error}=await sb.from("menu_items").delete().eq("id",id);if(error){$("menuMsg").textContent=error.message;return}$("menuMsg").textContent="Menu item deleted successfully.";await loadItems();}
 $("saveCategoryBtn").onclick=async()=>{
  const name=$("gmCategoryName").value.trim();
  const file=$("gmCategoryImageFile").files?.[0]||null;
  if(!name){$("menuMsg").textContent="Category name is required.";return;}
  const profile=await getProfile();
  if(!profile||!['gm','admin'].includes(profile.role)){$("menuMsg").textContent="GM access is required.";return;}
  let image_url=null;
  if(file){
    if(!file.type.startsWith('image/')){$("menuMsg").textContent="Please choose an image file.";return;}
    image_url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",0.82));};img.onerror=reject;img.src=r.result;};r.onerror=reject;r.readAsDataURL(file);});
  }
  const existing=await sb.from("menu_categories").select("id,name,image_url").eq("name",name).maybeSingle();
  if(existing.error){$("menuMsg").textContent=existing.error.message;return;}
  if(existing.data){
    const payload={status:"active"};
    if(image_url) payload.image_url=image_url;
    const {error}=await sb.from("menu_categories").update(payload).eq("id",existing.data.id);
    if(error){$("menuMsg").textContent=error.message;return;}
    $("menuMsg").textContent="Category updated successfully.";
  }else{
    const {error}=await sb.from("menu_categories").insert({name,image_url,status:"active"});
    if(error){$("menuMsg").textContent=error.message;return;}
    $("menuMsg").textContent="Category added successfully.";
  }
  $("gmCategoryName").value="";$("gmCategoryImageFile").value="";$("gmCategoryImageNote").textContent="Choose an image (optional).";
  await loadCategories();
};
$("deleteCategoryBtn").onclick=async()=>{
  const name=$("gmCategoryName").value.trim();
  if(!name){$("menuMsg").textContent="Enter the category name to delete.";return;}
  const profile=await getProfile();
  if(!profile||!['gm','admin'].includes(profile.role)){$("menuMsg").textContent="GM access is required.";return;}
  const found=await sb.from("menu_categories").select("id,name").eq("name",name).maybeSingle();
  if(found.error){$("menuMsg").textContent=found.error.message;return;}
  if(!found.data){$("menuMsg").textContent="Category not found.";return;}
  const used=await sb.from("menu_items").select("id",{count:"exact",head:true}).eq("category_id",found.data.id);
  if(used.error){$("menuMsg").textContent=used.error.message;return;}
  if((used.count||0)>0){$("menuMsg").textContent="This category has menu items. Delete or move its items first.";return;}
  if(!confirm(`Delete category "${name}"?`))return;
  const {error}=await sb.from("menu_categories").delete().eq("id",found.data.id);
  if(error){$("menuMsg").textContent=error.message;return;}
  $("gmCategoryName").value="";$("gmCategoryImageFile").value="";$("gmCategoryImageNote").textContent="Choose an image (optional).";
  $("menuMsg").textContent="Category deleted successfully.";
  await loadCategories();
};

 $("saveMenuBtn").onclick=async()=>{const id=$("gmMenuId").value.trim(),category_id=$("gmItemCategory").value,name=$("gmMenuName").value.trim(),description=$("gmMenuDescription").value.trim(),price=Number($("gmMenuPrice").value),image_url=$("gmMenuImage").value.trim(),status=$("gmMenuStatus").value;if(!category_id){$("menuMsg").textContent="Select a category.";return}if(!name){$("menuMsg").textContent="Item name is required.";return}if(!Number.isFinite(price)||price<0){$("menuMsg").textContent="Enter a valid price.";return}const profile=await getProfile();if(!profile||!['gm','admin'].includes(profile.role)){$("menuMsg").textContent="GM access is required.";return}const payload={category_id,name,description:description||null,price,image_url:image_url||null,status};let result;if(id)result=await sb.from("menu_items").update(payload).eq("id",id);else result=await sb.from("menu_items").insert({...payload,created_by:profile.id});if(result.error){$("menuMsg").textContent=result.error.message;return}$("menuMsg").textContent=id?"Menu item updated successfully.":"Menu item saved successfully.";clearForm();await loadItems();};
 $("cancelEditBtn").onclick=clearForm;

 (async()=>{const profile=await guardRole(["gm"]);if(!profile)return;await loadCategories();await loadItems();})();
})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));}</script></body></html>
