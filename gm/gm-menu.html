<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><link rel="manifest" href="../manifest.webmanifest"><title>Menu Management</title><link rel="stylesheet" href="../assets/style.css?v=20260925-final"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script></head><body data-page="gm-menu"><header class="topbar"><a class="brand brand-image" href="gm-dashboard.html"><img class="brand-logo" src="../assets/al-noor-approved-logo.png" alt="AL NOOR BAKERY & CAFE"></a><button class="icon" onclick="logout()">↪</button></header><main class="container"><h1 class="title">Menu Management</h1><p class="sub">Manage menu items, prices, availability, and additions.</p>
<div class="card"><h3>Add / Edit Menu Item</h3>
<div class="field"><label>Item Name</label><input class="input" id="gmMenuName" placeholder="e.g. Spanish Latte"></div>
<div class="field"><label>Description</label><input class="input" id="gmMenuDescription" placeholder="Short product description"></div>
<div class="field"><label>Price (AED)</label><input class="input" id="gmMenuPrice" type="number" step="0.01" min="0" placeholder="18"></div>
<div class="field"><label>Image URL (optional)</label><input class="input" id="gmMenuImage" placeholder="https://..."></div>
<div class="field"><label>Status</label><select class="input" id="gmMenuStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
<button class="btn primary block" id="saveMenuBtn">SAVE MENU ITEM</button><div id="menuMsg" class="note">Menu items are saved in the GM menu database.</div></div>
<div class="card"><h3>Current Menu</h3><div id="gmMenuList"><div class="empty">Loading menu…</div></div></div>
</main><nav class="nav"><div class="navin"><a href="gm-dashboard.html"><b>⌂</b>Dashboard</a><a href="gm-members.html"><b>●</b>Members</a><a href="gm-reports.html"><b>▤</b>Reports</a><a href="gm-menu.html" class="active"><b>✦</b>Menu</a><a href="gm-settings.html"><b>⚙</b>More</a></div></nav>
<script src="../assets/config.js?v=20260925-final"></script><script src="../assets/app.js?v=20260925-final"></script>
<script>
(function(){
 const msg=document.getElementById("menuMsg"),list=document.getElementById("gmMenuList");
 const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
 async function load(){
   const {data,error}=await sb.from("menu_items").select("id,name,description,price,image_url,status,created_at").order("created_at",{ascending:false});
   if(error){list.innerHTML='<div class="alert">'+esc(error.message)+'</div>';return}
   list.innerHTML=data?.length?data.map(r=>'<div class="reward">'+(r.image_url?'<img class="reward-product-image" src="'+esc(r.image_url)+'" alt="'+esc(r.name)+'">':'<div class="food">☕</div>')+'<div class="grow"><strong>'+esc(r.name)+'</strong><small>'+esc(r.description||"")+'<br>AED '+Number(r.price||0).toFixed(2)+'</small></div><span class="badge">'+esc(r.status)+'</span></div>').join(""):'<div class="empty">No menu items yet.</div>';
 }
 document.getElementById("saveMenuBtn").onclick=async()=>{
   const name=document.getElementById("gmMenuName").value.trim(),description=document.getElementById("gmMenuDescription").value.trim(),price=Number(document.getElementById("gmMenuPrice").value),image_url=document.getElementById("gmMenuImage").value.trim(),status=document.getElementById("gmMenuStatus").value;
   if(!name){msg.textContent="Item name is required.";return}
   if(!Number.isFinite(price)||price<0){msg.textContent="Enter a valid price.";return}
   const profile=await getProfile();
   if(!profile||profile.role!=="gm"){msg.textContent="GM access is required.";return}
   const {error}=await sb.from("menu_items").insert({name,description,price,image_url:image_url||null,status,created_by:profile.id});
   if(error){msg.textContent=error.message;return}
   msg.textContent="Menu item saved successfully.";
   ["gmMenuName","gmMenuDescription","gmMenuPrice","gmMenuImage"].forEach(id=>document.getElementById(id).value="");
   await load();
 };
 load();
})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));}</script></body></html>
