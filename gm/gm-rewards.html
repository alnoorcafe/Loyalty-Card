<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><link rel="manifest" href="../manifest.webmanifest"><title>Rewards Management</title><link rel="stylesheet" href="../assets/style.css?v=20260925-final"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script></head><body data-page="gm-rewards"><header class="topbar"><a class="brand brand-image" href="gm-dashboard.html"><img class="brand-logo" src="../assets/al-noor-approved-logo.png" alt="AL NOOR BAKERY & CAFE"></a><button class="icon" onclick="logout()">↪</button></header><main class="container"><h1 class="title">Rewards Management</h1><p class="sub">View the rewards customers receive after collecting 10 visit points.</p><div class="card"><h3>Current Rewards</h3><div id="rewardList"><div class="empty">Loading rewards…</div></div></div></main><nav class="nav"><div class="navin"><a href="gm-dashboard.html"><b>⌂</b>Dashboard</a><a href="gm-members.html"><b>♙</b>Members</a><a href="gm-reports.html"><b>▥</b>Reports</a><a href="gm-offers.html"><b>◇</b>Offers</a><a href="gm-settings.html"><b>⚙</b>More</a></div></nav><script src="../assets/config.js?v=20260925-final"></script><script src="../assets/app.js?v=20260925-final"></script><script>
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function loadRewards(){const box=document.getElementById("rewardList");const {data,error}=await sb.from("rewards").select("id,title,name,description,points_cost,is_active,image_url,created_at").order("created_at",{ascending:false});if(error){box.innerHTML=`<div class="alert">${esc(error.message)}</div>`;return}box.innerHTML=data?.length?data.map(r=>`<div class="reward">${r.image_url?`<img class="reward-product-image" src="${esc(r.image_url)}" alt="${esc(r.title||r.name)}">`:`<div class="food">★</div>`}<div class="grow"><strong>${esc(r.title||r.name||"Reward")}</strong><small>${esc(r.description||"")} • ${Number(r.points_cost||10)} points</small></div><span class="badge">${r.is_active?"Active":"Inactive"}</span></div>`).join(""):"<div class="empty">No rewards yet.</div>"}
(async()=>{const p=await guardRole(["gm"]);if(p)await loadRewards()})().catch(e=>{const box=document.getElementById("rewardList");if(box)box.innerHTML=`<div class="alert">${esc(e.message||"Could not load rewards.")}</div>`});
</script></body></html>
