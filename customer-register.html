<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#063D2A"
    >

    <title>Join Al Noor Loyalty</title>

    <style>

        :root {
            --green: #063D2A;
            --green-light: #0B5138;
            --cream: #F7F1E4;
            --white: #FFFDF8;
            --gold: #C9A34E;
            --gold-light: #E4C978;
            --text: #202A24;
            --muted: #777A72;
            --border: #DDD5C4;
            --error: #A33E35;
            --success: #3F713F;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #fffdf8 0%,
                    var(--cream) 55%,
                    #EDE4D4 100%
                );

            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        /* =========================
           PAGE
        ========================== */

        .page {
            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 16px;
        }

        .container {
            width: 100%;

            max-width: 500px;
        }

        /* =========================
           CARD
        ========================== */

        .card {
            background:
                rgba(255, 253, 248, .97);

            border:
                1px solid
                rgba(6, 61, 42, .10);

            border-radius: 24px;

            padding: 30px;

            box-shadow:
                0 18px 50px
                rgba(55, 48, 34, .12);
        }

        /* =========================
           LOGO
        ========================== */

        .logo {
            text-align: center;

            margin-bottom: 25px;
        }

        .logo-mark {
            position: relative;

            width: 90px;
            height: 75px;

            margin: 0 auto 5px;
        }

        .sun {
            position: absolute;

            width: 48px;
            height: 48px;

            left: 50%;
            top: 0;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    var(--gold-light),
                    var(--gold) 65%,
                    transparent 67%
                );
        }

        .leaf {
            position: absolute;

            width: 55px;
            height: 35px;

            left: 50%;
            bottom: 0;

            transform:
                translateX(-50%);

            background:
                var(--green);

            border-radius:
                100% 0 100% 0;
        }

        .leaf-line {
            position: absolute;

            width: 3px;
            height: 43px;

            left: 50%;
            bottom: -2px;

            background:
                var(--gold);

            transform:
                translateX(-50%)
                rotate(25deg);

            border-radius: 5px;
        }

        .brand {
            color: var(--green);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 34px;

            font-weight: 600;

            letter-spacing: 2px;
        }

        .brand-sub {
            color: var(--gold);

            font-size: 9px;

            letter-spacing: 5px;

            font-weight: 700;

            margin-top: 3px;
        }

        /* =========================
           TITLE
        ========================== */

        .eyebrow {
            text-align: center;

            color: var(--green);

            font-size: 10px;

            letter-spacing: 3px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        h1 {
            text-align: center;

            color: var(--green);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 32px;

            font-weight: 500;

            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;

            color: var(--muted);

            font-size: 13px;

            line-height: 1.6;

            margin:
                0 0 25px;
        }

        /* =========================
           FORM
        ========================== */

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;

            color: var(--text);

            font-size: 12px;

            font-weight: 800;

            margin-bottom: 7px;
        }

        .required {
            color: var(--gold);
        }

        .optional {
            color: var(--muted);

            font-weight: 400;

            font-size: 10px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 16px;

            opacity: .65;

            pointer-events: none;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"] {

            width: 100%;

            height: 48px;

            padding:
                0 14px 0 42px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            background: #FFFFFF;

            color: var(--text);

            font-size: 14px;

            outline: none;

            transition:
                border-color .2s,
                box-shadow .2s;
        }

        input:focus {

            border-color:
                var(--green);

            box-shadow:
                0 0 0 3px
                rgba(6, 61, 42, .08);
        }

        /* =========================
           BIRTHDAY
        ========================== */

        .birthday-note {

            display: flex;

            gap: 9px;

            align-items: flex-start;

            padding: 12px;

            margin-top: -5px;
            margin-bottom: 18px;

            background:
                #F4EDDB;

            border:
                1px solid
                rgba(201, 163, 78, .25);

            border-radius: 12px;

            color: #6F633F;

            font-size: 11px;

            line-height: 1.5;
        }

        .birthday-note-icon {
            font-size: 17px;
        }

        /* =========================
           CONSENT
        ========================== */

        .consent {

            display: flex;

            gap: 10px;

            align-items: flex-start;

            margin:
                4px 0 20px;
        }

        .consent input {

            width: 17px;
            height: 17px;

            margin: 1px 0 0;

            accent-color:
                var(--green);

            flex-shrink: 0;
        }

        .consent label {

            color: var(--muted);

            font-size: 11px;

            line-height: 1.55;

            cursor: pointer;
        }

        .consent strong {
            color: var(--green);
        }

        /* =========================
           BUTTON
        ========================== */

        .submit {

            width: 100%;

            height: 51px;

            border: 0;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--green-light),
                    var(--green)
                );

            color: white;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(6, 61, 42, .18);

            transition:
                transform .2s,
                box-shadow .2s;
        }

        .submit:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 14px 30px
                rgba(6, 61, 42, .25);
        }

        .submit:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {

            display: none;

            padding: 13px;

            margin-bottom: 16px;

            border-radius: 11px;

            font-size: 12px;

            line-height: 1.5;

            text-align: center;
        }

        .message.error {

            display: block;

            color: var(--error);

            background:
                #F8E7E3;

            border:
                1px solid
                #EAC9C3;
        }

        .message.success {

            display: block;

            color: var(--success);

            background:
                #E7F1E3;

            border:
                1px solid
                #C9DEC2;
        }

        /* =========================
           LOGIN LINK
        ========================== */

        .login {

            text-align: center;

            margin-top: 22px;

            padding-top: 20px;

            border-top:
                1px solid
                #EAE3D6;

            color: var(--muted);

            font-size: 12px;
        }

        .login a {

            color: var(--green);

            font-weight: 800;

            text-decoration: none;
        }

        /* =========================
           SECURITY
        ========================== */

        .security {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            margin-top: 17px;

            color: #96958D;

            font-size: 10px;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            .page {
                padding: 15px;
            }

            .card {
                padding: 24px 18px;
                border-radius: 20px;
            }

            h1 {
                font-size: 29px;
            }

            .brand {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<main class="page">

    <div class="container">

        <div class="card">


            <!-- =========================
                 LOGO
            ========================== -->

            <div class="logo">

                <div class="logo-mark">

                    <div class="sun"></div>

                    <div class="leaf"></div>

                    <div class="leaf-line"></div>

                </div>

                <div class="brand">
                    AL NOOR
                </div>

                <div class="brand-sub">
                    LOYALTY
                </div>

            </div>


            <!-- =========================
                 TITLE
            ========================== -->

            <div class="eyebrow">
                AL NOOR MODERN BAKERY
            </div>

            <h1>
                Create Account
            </h1>

            <p class="subtitle">
                Join Al Noor Loyalty and start
                collecting points and rewards.
            </p>


            <!-- =========================
                 MESSAGE
            ========================== -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- =========================
                 FORM
            ========================== -->

            <form id="registerForm">


                <!-- FULL NAME -->

                <div class="field">

                    <label for="fullName">
                        Full Name
                        <span class="required">*</span>
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">
                            👤
                        </span>

                        <input
                            id="fullName"
                            type="text"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>


                <!-- MOBILE -->

                <div class="field">

                    <label for="mobile">
                        Mobile Number
                        <span class="required">*</span>
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">
                            📱
                        </span>

                        <input
                            id="mobile"
                            type="tel"
                            placeholder="05XXXXXXXX"
                            autocomplete="tel"
                            required
                        >

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="field">

                    <label for="email">
                        Email Address
                        <span class="required">*</span>
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">
                            ✉️
                        </span>

                        <input
                            id="email"
                            type="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- DATE OF BIRTH -->

                <div class="field">

                    <label for="birthday">

                        Date of Birth

                        <span class="optional">
                            (Optional)
                        </span>

                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">
                            🎂
                        </span>

                        <input
                            id="birthday"
                            type="date"
                            autocomplete="bday"
                        >

                    </div>

                </div>


                <!-- BIRTHDAY NOTE -->

                <div class="birthday-note">

                    <div class="birthday-note-icon">
                        🎁
                    </div>

                    <div>

                        Add your birthday so Al Noor can
                        remember your special day and
                        send you a birthday greeting.

                    </div>

                </div>


                <!-- BIRTHDAY CONTACT CONSENT -->

                <div class="consent">

                    <input
                        id="birthdayConsent"
                        type="checkbox"
                    >

                    <label for="birthdayConsent">

                        I agree that Al Noor Modern Bakery
                        may contact me on or around my birthday
                        to send me a birthday greeting.

                        <strong>
                            Birthday greetings only.
                        </strong>

                    </label>

                </div>


                <!-- MESSAGE -->

                <div
                    id="formMessage"
                    class="message"
                ></div>


                <!-- SUBMIT -->

                <button
                    id="submitButton"
                    type="submit"
                    class="submit"
                >

                    Create My Loyalty Account

                </button>


            </form>


            <!-- =========================
                 LOGIN
            ========================== -->

            <div class="login">

                Already have an account?

                <a href="customer-login.html">
                    Login
                </a>

            </div>


            <!-- =========================
                 SECURITY
            ========================== -->

            <div class="security">

                🔒

                <span>
                    Secure email login · No password required
                </span>

            </div>


        </div>

    </div>

</main>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

    /*
     * =====================================================
     * AL NOOR SUPABASE CONFIGURATION
     * =====================================================
     *
     * Put your NEW Supabase project information here.
     *
     * IMPORTANT:
     *
     * Use the PUBLISHABLE key only.
     *
     * NEVER put:
     *
     * sb_secret_...
     *
     * or service_role keys in this browser file.
     */

    const SUPABASE_URL =
        "PASTE_NEW_SUPABASE_PROJECT_URL_HERE";

    const SUPABASE_PUBLISHABLE_KEY =
        "PASTE_NEW_SUPABASE_PUBLISHABLE_KEY_HERE";


    /*
     * =====================================================
     * CREATE SUPABASE CLIENT
     * =====================================================
     */

    let supabaseClient = null;


    if (
        SUPABASE_URL.startsWith("https://")
        &&
        SUPABASE_PUBLISHABLE_KEY.startsWith("sb_publishable_")
    ) {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

    }


    /*
     * =====================================================
     * ELEMENTS
     * =====================================================
     */

    const form =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");

    const formMessage =
        document.getElementById("formMessage");

    const submitButton =
        document.getElementById("submitButton");


    /*
     * =====================================================
     * MESSAGE FUNCTION
     * =====================================================
     */

    function showMessage(
        text,
        type = "error"
    ) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /*
     * =====================================================
     * FORM SUBMIT
     * =====================================================
     */

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /*
             * Clear messages
             */

            message.style.display = "none";

            formMessage.style.display = "none";


            /*
             * Get values
             */

            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();

            const mobile =
                document
                    .getElementById("mobile")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();

            const birthday =
                document
                    .getElementById("birthday")
                    .value;

            const birthdayConsent =
                document
                    .getElementById("birthdayConsent")
                    .checked;


            /*
             * Basic validation
             */

            if (!fullName) {

                showMessage(
                    "Please enter your full name."
                );

                return;
            }


            if (!mobile) {

                showMessage(
                    "Please enter your mobile number."
                );

                return;
            }


            if (!email) {

                showMessage(
                    "Please enter your email address."
                );

                return;
            }


            /*
             * Birthday consent validation
             *
             * If customer enters birthday,
             * they can choose whether Al Noor
             * may contact them.
             */

            if (
                birthday &&
                birthdayConsent
            ) {

                console.log(
                    "Birthday contact consent granted."
                );

            }


            /*
             * Supabase configuration check
             */

            if (!supabaseClient) {

                showMessage(
                    "Supabase is not connected yet. Add the new Supabase URL and Publishable Key to this file first."
                );

                return;
            }


            /*
             * Disable button
             */

            submitButton.disabled = true;

            submitButton.textContent =
                "Creating Account...";


            try {


                /*
                 * =================================================
                 * MAGIC LINK
                 * =================================================
                 *
                 * No password.
                 * No Face ID.
                 * No Passkey.
                 */

                const { data, error } =
                    await supabaseClient.auth.signInWithOtp({

                        email: email,

                        options: {

                            shouldCreateUser: true,

                            emailRedirectTo:
                                window.location.origin
                                +
                                "/customer-home.html",

                            data: {

                                full_name:
                                    fullName,

                                phone:
                                    mobile,

                                date_of_birth:
                                    birthday || null,

                                birthday_contact_consent:
                                    birthdayConsent,

                                role:
                                    "customer"

                            }

                        }

                    });


                /*
                 * Supabase error
                 */

                if (error) {

                    console.error(
                        "Supabase registration error:",
                        error
                    );

                    showMessage(
                        error.message ||
                        "Unable to create the account."
                    );

                    return;
                }


                /*
                 * SUCCESS
                 */

                showMessage(
                    "Your account is ready. Check your email for the secure Al Noor login link.",
                    "success"
                );


                /*
                 * Clear form
                 */

                form.reset();


            } catch (error) {

                console.error(error);

                showMessage(
                    "Something went wrong. Please try again."
                );

            } finally {

                submitButton.disabled = false;

                submitButton.textContent =
                    "Create My Loyalty Account";

            }

        }
    );

</script>


</body>

</html>
