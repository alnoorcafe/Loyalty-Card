<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073a2b"><link rel="stylesheet" href="assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script src="assets/config.js"></script><title>Al Noor Diagnostics</title></head><body><main class="container"><div class="authbox" style="max-width:760px;margin:30px auto"><div class="logo"><div class="sun">☀</div><h1>AL NOOR</h1><small>DIAGNOSTICS</small></div><p class="sub">This page checks the live GitHub Pages build and Supabase connection. It never displays your publishable key.</p><div id="results"></div><div class="note" style="margin-top:18px">Live site: https://alnoorcafe.github.io/Loyalty-Card/</div><a class="btn soft block" style="margin-top:12px" href="index.html">← Back to Al Noor</a></div></main><script>const out=document.getElementById('results');function row(n,s,d){out.insertAdjacentHTML('beforeend',`<div class="card" style="margin:10px 0"><b>${n}</b><div class="sub" style="margin:6px 0 0;color:${s?'#286b4d':'#9b3d2f'}">${s?'PASS':'FAIL'} — ${d}</div></div>`)}async function run(){const c=window.AL_NOOR_CONFIG||{};row('1. config.js',!!c.SUPABASE_URL&&!!c.SUPABASE_PUBLISHABLE_KEY&&!String(c.SUPABASE_PUBLISHABLE_KEY).includes('PASTE_NEW_'),c.SUPABASE_URL?c.SUPABASE_URL:'Supabase URL/key missing');if(!window.supabase){row('2. Supabase JS',false,'Supabase library did not load.');return}const sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});row('2. Supabase JS',true,'Library loaded.');try{const {data,error}=await sb.auth.getSession();row('3. Supabase connection',!error,error?error.message:(data.session?'Session found.':'Connected; no active session.'));if(data.session){const {data:p,error:pe}=await sb.rpc('get_my_profile');row('4. get_my_profile',!pe,pe?pe.message:(Array.isArray(p)?JSON.stringify(p[0]||{}):JSON.stringify(p||{})));const {data:q,error:qe}=await sb.from('profiles').select('id,role,full_name,member_id').eq('id',data.session.user.id).maybeSingle();row('5. profiles fallback',!qe,qe?qe.message:JSON.stringify(q||{}));}}catch(e){row('3. Runtime',false,e.message||String(e))}}run();</script></body></html>
