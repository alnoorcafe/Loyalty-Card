<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><link rel="manifest" href="../manifest.webmanifest"><title>Staff Rewards</title><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script></head><body data-page="staff-rewards"><header class="topbar"><a class="brand brand-image" href="staff-scan.html"><img class="brand-logo" src="../assets/al-noor-approved-logo.png" alt="AL NOOR BAKERY & CAFE"></a><button class="icon" onclick="logout()">↪</button></header><main class="container"><h1 class="title">Rewards</h1><p class="sub">Staff can create and manage the rewards customers receive after collecting 10 visit points.</p><div class="card"><h3>Add Reward</h3><div class="field"><label>Reward Name</label><input class="input" id="rewardName" placeholder="e.g. Free Drink"></div><div class="field"><label>Description</label><input class="input" id="rewardDescription" placeholder="e.g. One free drink"></div><div class="field"><label>Points Cost</label><input class="input" id="rewardPoints" type="number" min="1" value="10"></div><div class="field"><label>Reward Image</label><input class="input" id="rewardImage" type="file" accept="image/*"></div><div class="field"><label>Status</label><select class="input" id="rewardStatus"><option value="true">Active</option><option value="false">Inactive</option></select></div><button class="btn primary block" id="saveRewardBtn">SAVE REWARD</button><div id="rewardMsg" class="note">Rewards are saved in the rewards database.</div></div><div class="card"><h3>Current Rewards</h3><div id="rewardList"><div class="empty">Loading rewards…</div></div></div></main><nav class="nav"><div class="navin"><a href="staff-scan.html"><b>⌗</b>Scan</a><a href="staff-customer.html"><b>●</b>Customer</a><a href="staff-rewards.html" class="active"><b>★</b>Rewards</a><a href="staff-history.html"><b>↺</b>History</a><a href="staff-profile.html"><b>●</b>Profile</a></div></nav><script src="../assets/config.js"></script><script src="../assets/app.js"></script><script>
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function fileToDataUrl(file){if(!file||!file.type.startsWith("image/"))throw new Error("Please choose an image file.");if(file.size>5*1024*1024)throw new Error("Image must be 5 MB or smaller.");const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error("Could not read image."));r.readAsDataURL(file);});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error("Invalid image."));i.src=raw;});const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.78)}
async function loadRewards(){const box=document.getElementById("rewardList");const {data,error}=await sb.from("rewards").select("id,title,name,description,points_cost,is_active,image_url,created_at").order("created_at",{ascending:false});if(error){box.innerHTML=`<div class="alert">${esc(error.message)}</div>`;return}box.innerHTML=data?.length?data.map(r=>`<div class="reward">${r.image_url?`<img class="reward-product-image" src="${esc(r.image_url)}" alt="${esc(r.title||r.name||"Reward")}">`:`<div class="food">★</div>`}<div class="grow"><strong>${esc(r.title||r.name||"Reward")}</strong><small>${esc(r.description||"")} • ${Number(r.points_cost||10)} points</small></div><span class="badge">${r.is_active?"Active":"Inactive"}</span></div>`).join(""):"<div class="empty">No rewards yet.</div>"}
document.getElementById("saveRewardBtn").onclick=async()=>{const msg=document.getElementById("rewardMsg");try{const name=document.getElementById("rewardName").value.trim(),description=document.getElementById("rewardDescription").value.trim(),points_cost=Number(document.getElementById("rewardPoints").value||10),is_active=document.getElementById("rewardStatus").value==="true";if(!name){msg.textContent="Reward name is required.";return}const profile=await getProfile();if(!profile||profile.role!=="staff"){msg.textContent="Staff access is required.";return}const file=document.getElementById("rewardImage").files?.[0];const image_url=file?await fileToDataUrl(file):null;const {error}=await sb.from("rewards").insert({title:name,name,description,points_cost,is_active,image_url:image_url||null,created_by:profile.id});if(error)throw error;msg.textContent="Reward saved successfully.";document.getElementById("rewardName").value="";document.getElementById("rewardDescription").value="";document.getElementById("rewardPoints").value="10";document.getElementById("rewardImage").value="";await loadRewards()}catch(e){msg.textContent=e.message||"Could not save reward."}};
(async()=>{const p=await guardRole(["staff"]);if(p)await loadRewards()})().catch(e=>{const box=document.getElementById("rewardList");if(box)box.innerHTML=`<div class="alert">${esc(e.message||"Could not load rewards.")}</div>`});
</script></body></html>
