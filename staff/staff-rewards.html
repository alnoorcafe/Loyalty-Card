<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#073a2b"><link rel="manifest" href="../manifest.webmanifest"><title>Staff Rewards</title><link rel="stylesheet" href="../assets/style.css?v=20260926-rewards-card"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script></head><body data-page="staff-rewards"><header class="topbar"><a class="brand brand-image" href="staff-scan.html"><img class="brand-logo" src="../assets/al-noor-approved-logo.png" alt="AL NOOR BAKERY & CAFE"></a><button class="icon" onclick="logout()">↪</button></header><main class="container"><h1 class="title">Rewards</h1><p class="sub">Rewards customers receive after collecting 10 visit points.</p><div id="featuredReward"><div class="card"><div class="empty">Loading reward…</div></div></div><div class="card" style="margin-top:16px"><button class="btn block" id="manageRewardsBtn" type="button">MANAGE REWARDS</button></div><div id="managePanel" style="display:none"><div class="card"><h3>Add Reward</h3><div class="field"><label>Reward Name</label><input class="input" id="rewardName" placeholder="e.g. Free Order"></div><div class="field"><label>Description</label><input class="input" id="rewardDescription" placeholder="e.g. Free Order Coupon"></div><div class="field"><label>Points Cost</label><input class="input" id="rewardPoints" type="number" min="1" value="10"></div><div class="field"><label>Reward Image</label><input class="input" id="rewardImage" type="file" accept="image/*"></div><div class="field"><label>Status</label><select class="input" id="rewardStatus"><option value="true">Active</option><option value="false">Inactive</option></select></div><button class="btn primary block" id="saveRewardBtn">SAVE REWARD</button><div id="rewardMsg" class="note">Rewards are saved in the rewards database.</div></div><div class="card"><h3>Current Rewards</h3><div id="rewardList"><div class="empty">Loading rewards…</div></div></div></div></main><nav class="nav"><div class="navin"><a href="staff-scan.html"><b>⌗</b>Scan</a><a href="staff-customer.html"><b>●</b>Customer</a><a href="staff-rewards.html" class="active"><b>★</b>Rewards</a><a href="staff-history.html"><b>↺</b>History</a><a href="staff-profile.html"><b>●</b>Profile</a></div></nav><script src="../assets/config.js?v=20260926-rewards-card"></script><script src="../assets/app.js?v=20260926-rewards-card"></script><script>
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
async function fileToDataUrl(file){if(!file||!file.type.startsWith("image/"))throw new Error("Please choose an image file.");if(file.size>5*1024*1024)throw new Error("Image must be 5 MB or smaller.");const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error("Could not read image."));r.readAsDataURL(file);});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error("Invalid image."));i.src=raw;});const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.78)}
function couponCode(r){const raw=String(r.coupon_code||r.code||r.id||"").replace(/[^A-Za-z0-9]/g,"").toUpperCase();return raw?`ALNOOR-${raw.slice(-6)}`:"ALNOOR-FREE10"}
function rewardCard(r){const title=r?.title||r?.name||"Free Order";const points=Number(r?.points_cost||10);const code=couponCode(r||{});return `<div class="card" style="border:2px solid rgba(190,150,70,.35);background:linear-gradient(135deg,#fffdf7,#f7f3e8);text-align:center;padding:26px 20px"><div style="font-size:13px;letter-spacing:2px;font-weight:800;color:#b58b3b">FREE ORDER</div>${r?.image_url?`<img src="${esc(r.image_url)}" alt="${esc(title)}" style="width:110px;height:110px;object-fit:cover;border-radius:22px;margin:14px auto;display:block">`:`<div style="font-size:48px;margin:12px 0">🎁</div>`}<h2 style="margin:4px 0 8px;color:#073a2b">${esc(title)}</h2><p style="margin:0 0 14px;color:#68756f">${esc(r?.description||"Free Order Coupon")}</p><div style="font-size:18px;font-weight:800;color:#073a2b;margin-bottom:14px">${points} Points</div><div style="border:2px dashed #c7a65b;border-radius:14px;padding:14px;background:#fff"><div style="font-size:11px;letter-spacing:2px;color:#7b807a;margin-bottom:6px">COUPON CODE</div><strong id="featuredCouponCode" style="font-size:22px;letter-spacing:1px;color:#073a2b">${code}</strong><button class="btn block" type="button" style="margin-top:12px" onclick="copyCouponCode('${code}')">COPY CODE</button></div></div>`}
async function copyCouponCode(code){try{await navigator.clipboard.writeText(code);toast("Coupon code copied.",true)}catch(e){alert(code)}}
async function loadRewards(){const box=document.getElementById("rewardList"),featured=document.getElementById("featuredReward");const {data,error}=await sb.from("rewards").select("id,title,name,description,points_cost,is_active,image_url,created_at").order("created_at",{ascending:false});if(error){featured.innerHTML=`<div class="card"><div class="alert">${esc(error.message)}</div></div>`;return}const active=(data||[]).filter(r=>r.is_active);featured.innerHTML=active.length?rewardCard(active[0]):`<div class="card" style="text-align:center;padding:28px"><div style="font-size:42px">🎁</div><h2 style="color:#073a2b">Free Order</h2><p class="empty">No active reward has been created yet.</p><p class="note">Open Manage Rewards to create the 10-point Free Order reward.</p></div>`;box.innerHTML=data?.length?data.map(r=>`<div class="reward">${r.image_url?`<img class="reward-product-image" src="${esc(r.image_url)}" alt="${esc(r.title||r.name||"Reward")}">`:`<div class="food">★</div>`}<div class="grow"><strong>${esc(r.title||r.name||"Reward")}</strong><small>${esc(r.description||"")} • ${Number(r.points_cost||10)} points • ${couponCode(r)}</small></div><span class="badge">${r.is_active?"Active":"Inactive"}</span></div>`).join(""):"<div class="empty">No rewards yet.</div>"}
document.getElementById("manageRewardsBtn").onclick=()=>{const p=document.getElementById("managePanel");p.style.display=p.style.display==="none"?"block":"none"};
document.getElementById("saveRewardBtn").onclick=async()=>{const msg=document.getElementById("rewardMsg");try{const name=document.getElementById("rewardName").value.trim(),description=document.getElementById("rewardDescription").value.trim(),points_cost=Number(document.getElementById("rewardPoints").value||10),is_active=document.getElementById("rewardStatus").value==="true";if(!name){msg.textContent="Reward name is required.";return}const profile=await getProfile();if(!profile||profile.role!=="staff"){msg.textContent="Staff access is required.";return}const file=document.getElementById("rewardImage").files?.[0];const image_url=file?await fileToDataUrl(file):null;const {error}=await sb.from("rewards").insert({title:name,name,description,points_cost,is_active,image_url:image_url||null,created_by:profile.id});if(error)throw error;msg.textContent="Reward saved successfully.";document.getElementById("rewardName").value="";document.getElementById("rewardDescription").value="";document.getElementById("rewardPoints").value="10";document.getElementById("rewardImage").value="";await loadRewards()}catch(e){msg.textContent=e.message||"Could not save reward."}};
(async()=>{const p=await guardRole(["staff"]);if(p)await loadRewards()})().catch(e=>{const box=document.getElementById("rewardList");if(box)box.innerHTML=`<div class="alert">${esc(e.message||"Could not load rewards.")}</div>`});
</script></body></html>
